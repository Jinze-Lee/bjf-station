	<!-- 字体自托管，不引 fonts.googleapis.com —— 国内加载不到，会卡到超时。

	<link rel="stylesheet" href="css/fonts.css" />

	<!-- 主题必须在首屏绘制**之前**定下来。
	     放到 js/theme.js 里就晚了 —— 那时页面已经按默认的深色画了一帧，
	     偏好是浅色的访客每次都会看到一下深色闪屏。
	     所以这段同步内联脚本必须留在 <head> 里、样式表之后。
	     逻辑与 js/theme.js 保持一致，改一处要同步改另一处。 -->
	<script>
		(function () {
			try {
				var saved = localStorage.getItem('bfers-theme');
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.setAttribute('data-theme', saved);
				}
				/* 没存过就用默认的深色，不跟随系统 —— 这个站的深色是主视觉，
				   不是「夜间模式」，不该被系统设置悄悄改掉。 */
			} catch (e) { /* 隐私模式下 localStorage 会抛错，忽略即可 */ }
		}());
	</script>
</head>

			<!-- 三个小节标题。原先是写在段首的「液流通量密度。」这类粗体短语，
			     它们本身不成句，读起来像病句；改成真正的小节标题，
			     段落也就从完整的句子起头了。 -->
			<h4 class="m-sub" data-i18n="methods.sub.fd"></h4>
			<p data-i18n-html="methods.fd"></p>

			<p class="equation">K = (&Delta;T<sub>0</sub> &minus; &Delta;T) / &Delta;T</p>

			<p data-i18n-html="methods.k.where"></p>

			<p class="equation">F<sub>d</sub> = 4.284 &middot; K<sup>1.231</sup> &nbsp;&nbsp;[dm&sup3; dm<sup>&minus;2</sup> h<sup>&minus;1</sup>] &nbsp;=&nbsp; 0.0119 &middot; K<sup>1.231</sup> &nbsp;&nbsp;[cm&sup3; cm<sup>&minus;2</sup> s<sup>&minus;1</sup>]</p>

				<svg id="netDiagram" viewBox="0 0 1060 540" role="img"

					<!-- ============ 连线：先画，压在节点下方 ============
					     通路 A（下）：液流 —— 有线汇聚到 DT80，再统一无线回传
					     通路 B（上）：径向变化仪 —— 各自独立无线，直达工作站

					<g class="wires">
						<!-- 通路 A：有线段 -->
						<path id="wS1" class="wire wired" d="M 152 218 C 250 218, 300 334, 386 326" />
						<path id="wS2" class="wire wired" d="M 152 338 C 250 338, 310 334, 386 334" />
						<path id="wS3" class="wire wired" d="M 152 458 C 250 458, 300 334, 386 342" />
						<!-- 通路 A：数采 -> 无线单元 -> 工作站 -->
						<path id="wLM" class="wire wired" d="M 560 334 L 632 334" />
						<path id="wML" class="wire radio" d="M 724 334 C 786 334, 824 334, 870 334" />
						<!-- 通路 B：三台径向变化仪各自独立上行 -->
						<path id="wD1" class="wire radio dr" d="M 180 180 C 214 180, 222 130, 240 108 C 258 92, 290 92, 350 92 L 856 92 C 902 92, 916 180, 916 254" />
						<path id="wD2" class="wire radio dr" d="M 180 300 C 220 300, 232 200, 250 160 C 268 122, 300 114, 380 114 L 876 114 C 926 114, 942 192, 942 254" />
						<path id="wD3" class="wire radio dr" d="M 180 420 C 228 420, 244 280, 262 200 C 280 152, 316 136, 412 136 L 896 136 C 950 136, 968 202, 968 254" />
					</g>

					<!-- ============ 流动的数据包 ============
					     ⚠️ 错开出发时间必须用**负** begin，不能用正的。
					     正的 begin（如 begin="2.7s"）在到点之前，SMIL 让元素停在它的
					     静态位置上 —— <circle> 没写 cx/cy 就是 (0,0)，于是开头几秒钟
					     会有 3 个小圆点堆在图的左上角，像脏点（实测确实如此）。
					     负的 begin 表示「动画已经跑了这么久」，元素从第一帧起就在路径上，
					     错开效果完全一样，左上角干干净净。 -->
					<g class="packets">
						<circle class="pkt sf" r="3.6"><animateMotion dur="5.4s" repeatCount="indefinite" begin="0s"><mpath href="#wS1"/></animateMotion></circle>
						<circle class="pkt sf" r="3.6"><animateMotion dur="5.4s" repeatCount="indefinite" begin="-2.7s"><mpath href="#wS2"/></animateMotion></circle>
						<circle class="pkt sf" r="3.6"><animateMotion dur="5.4s" repeatCount="indefinite" begin="-1.35s"><mpath href="#wS3"/></animateMotion></circle>

						<rect class="pkt mix" x="-5" y="-3.2" width="10" height="6.4" rx="1.6"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#wLM"/></animateMotion></rect>
						<rect class="pkt mix" x="-5.5" y="-3.4" width="11" height="6.8" rx="1.7"><animateMotion dur="3.8s" repeatCount="indefinite" begin="0s"><mpath href="#wML"/></animateMotion></rect>

						<circle class="pkt dr" r="3.6"><animateMotion dur="7.4s" repeatCount="indefinite" begin="0s"><mpath href="#wD1"/></animateMotion></circle>
						<circle class="pkt dr" r="3.6"><animateMotion dur="7.4s" repeatCount="indefinite" begin="-2.4s"><mpath href="#wD2"/></animateMotion></circle>
						<circle class="pkt dr" r="3.6"><animateMotion dur="7.4s" repeatCount="indefinite" begin="-4.8s"><mpath href="#wD3"/></animateMotion></circle>
					</g>

					<!-- ============ 实验室工作站 ============ -->
					<g class="node lab" data-node="lab" tabindex="0" role="button">
						<rect class="screen" x="870" y="256" width="138" height="100" rx="4" />
						<rect class="screen-in" x="879" y="265" width="120" height="82" rx="2" />
						<path class="scr-l l1" d="M 890 330 L 912 306 L 934 320 L 956 292 L 978 314 L 996 302" />
						<path class="scr-l l2" d="M 890 340 L 914 334 L 938 338 L 962 330 L 984 336 L 996 332" />
						<path class="base" d="M 852 372 L 1028 372 L 1012 358 L 866 358 Z" />
					</g>
					<text class="cap" x="940" y="400" data-i18n="net.lab"></text>
					<text class="cap sub" x="940" y="418" data-i18n="net.labSub"></text>

					<!-- ============ 幽灵光标：示意「这些节点能点」 ============
					     放在最后 = 画在最上层。pointer-events:none，绝不挡真实点击。
					     动画（移动 + 点击涟漪）全在 style.css 里，见 netGhostPath /
					     netGhostClick；三个停留点的坐标与下面三个节点中心对齐：
					       径向变化仪 (126,320) -> 数采 (474,334) -> 工作站 (939,306)
					     用户一旦真的点/悬停/聚焦任意节点，js/network.js 会给 .net-wrap
					     加上 is-explored，动画就此永久停止。 -->
					<g id="netGhost" class="net-ghost" aria-hidden="true">
						<circle class="gh-ring" cx="0" cy="0" r="13" />
						<path class="gh-cursor"
						      d="M 0 0 L 0 17.5 L 4.3 13.4 L 7 19.4 L 10 18 L 7.3 12.1 L 12.4 12.1 Z" />
					</g>
				</svg>
				</div>
				<p class="net-hint" data-i18n="net.hint"></p>

				<div id="netDetail" class="net-detail" role="status"></div>
			</div>
		</section>

		<!-- ---------------------- 树木位置 ---------------------- -->
		<section id="location">
			<h3 data-i18n="location.h3"></h3>
			<p data-i18n-html="location.p"></p>
		</section>
	</div>
</div>

<div id="map_canvas"></div>

<div id="primary-container">
	<div class="row">

		<!-- ---------------------- 树木数据 ---------------------- -->
		<section id="treedata">
			<h3 data-i18n="treedata.h3"></h3>
			<p data-i18n="treedata.p"></p>

			<div class="tree-picker">
				<label for="treeSelect" data-i18n="treedata.pick"></label>
				<select id="treeSelect"></select>
			</div>

			<!-- ============ 上下两张图 + 底部一条共用时间轴 ============
			     上图：液流 + 径向（rangeSelector 在它顶部；navigator/scrollbar 已关掉）
			     下图：环境条件（navigator + scrollbar 在它底部，同时控制两张图）
			     两张图的绘图区左右边距写死成同一个值，同一时刻才在同一条竖线上。 -->
			<div class="chart-stack">
				<div id="chartDIASF"></div>
				<div id="chartEnv"></div>
				<p id="envEmpty" class="env-empty" data-i18n="env.empty" style="display:none"></p>

				<!-- 标签栏放在**时间轴下面**。
				     原先夹在两张图中间，拖 navigator 手柄时 Highcharts 会在手柄
				     上方弹出日期气泡，正好被标签挡住，看不见自己拖到了哪一天。 -->
				<div class="env-bar">
					<div id="envTags" class="env-tags"></div>
					<div class="env-actions">
						<button type="button" id="envAll"  class="env-btn" data-i18n="env.all"></button>
						<button type="button" id="envNone" class="env-btn" data-i18n="env.none"></button>
					</div>
				</div>
			</div>

			<!-- 完整数据集解锁条。内容由 js/unlock.js 生成 ——
			     站点公开的只有最近 7 天，完整数据集是加密的，需要口令。
			     放在图表正下方，因为它说明的正是「上面这两张图现在给你看多少」。 -->
			<div id="unlockBar" class="unlock-bar"></div>

			<p class="chart-note">
				<span><span class="swatch sapflow"></span><span data-i18n="treedata.noteFd"></span></span>
				<span><span class="swatch diameter"></span><span data-i18n="treedata.noteDia"></span></span>
			</p>

			<p id="envScaleNote" class="footnote env-scale-note" data-i18n-html="env.scaleNote"
			   style="display:none"></p>

			<div id="treeInfo" class="tree-info"></div>

			<!-- 内容由 js/data-source.js 按 OBS_META.source 自动切换：
			     合成数据 -> 橙色警示条；实测数据 -> 中性信息条 + 批次清单。
			     导入实测数据后警示条会自动消失，不需要手工改文案。 -->
			<p id="dataSource" class="footnote demo-warning"></p>

			<!-- 环境变量的说明放在图表**下面**：上方两张图要贴在一起对比，
			     中间塞一段介绍会把它们切开。 -->
			<div class="env-block">
				<h4 data-i18n="env.h4"></h4>
				<p class="env-intro" data-i18n-html="env.p"></p>
				<p class="footnote" data-i18n-html="env.note"></p>
			</div>
		</section>

		<!-- ---------------------- 联系我们 ---------------------- -->
		<section id="contact">
			<h3 data-i18n="contact.h3"></h3>

			<div class="contact-grid">
				<dl class="site-facts">
					<div><dt data-i18n="contact.f.station"></dt><dd data-i18n="contact.v.station"></dd></div>
					<div><dt data-i18n="contact.f.operator"></dt><dd data-i18n="contact.v.operator"></dd></div>
					<div><dt data-i18n="contact.f.person"></dt><dd><a href="mailto:lijinze@ibcas.ac.cn">lijinze@ibcas.ac.cn</a></dd></div>
					<div><dt data-i18n="contact.f.location"></dt><dd data-i18n="contact.v.location"></dd></div>
				</dl>

				<figure class="qr-card">
					<img src="images/wechat-qr.webp" alt="北京森林站 微信公众号二维码" />
					<figcaption><span data-i18n="contact.qr"></span><br /><strong>北京森林站</strong></figcaption>
				</figure>
			</div>

			<!-- 站点版本。改版本号只改 i18n 里的 site.version 一处，中英共用同一个数字。
			     数据更新日期由 js/data-source.js 从 OBS_META 自动填，不用手写。 -->
			<p class="site-version">
				<span data-i18n="site.version"></span>
				<span class="sv-sep">·</span>
				<span data-i18n="site.updatedLabel"></span>
				<span id="siteDataDate"></span>
				<!-- 更新日志弹层由 js/changelog.js 生成，内容也写在那里 -->
				<button type="button" id="changelogBtn" class="cl-btn"
				        data-i18n="cl.open"></button>
			</p>
		</section>

	</div>
</div>

<!-- ============================== FOOTER ============================== -->
<footer>
	<div class="footer-bottom">
		<div class="footer-inner">
			<div class="footer-left">
				<div class="footer-logos">
					<a href="https://www.cas.cn/" target="_blank" rel="noopener"><img src="images/logo-cas.webp" alt="中国科学院" /></a>
					<a href="http://www.ibcas.ac.cn/" target="_blank" rel="noopener"><img src="images/logo-ibcas.webp" alt="中国科学院植物研究所" /></a>
					<a href="http://www.cern.ac.cn/" target="_blank" rel="noopener"><img src="images/logo-cern.webp" alt="中国生态系统研究网络" /></a>
				</div>
				<div class="copyright">
					<span data-i18n="footer.copyright"></span><br />
					<a href="http://www.ibcas.ac.cn/" target="_blank" rel="noopener" data-i18n="footer.operator"></a>
				</div>
			</div>
			<div class="footer-right">
				<!-- 树种组成条：内容由 js/footer-composition.js 从 trees.js 现算，
				     棵数/树种数/样点数都不写死 -->
				<div id="footerComposition" class="footer-composition"></div>
			</div>
		</div>
	</div>
</footer>

<!-- =========================================================================
     首屏必需的脚本。
     地图（leaflet + map.js）和图表（highstock + observations + chart*）
     不在这里 —— 它们加起来 560 KB 多，改成滚到跟前才下，见 js/lazy-load.js。
     ========================================================================= -->

<!-- i18n 必须最先：其余模块初始化时要读当前语言 -->
<script src="js/i18n.js"></script>

<!-- theme 要在 chart.js / map.js 之前：它们初始化时会调 Theme.onChange 注册重绘回调。
     注意首屏主题不是这里定的，是 <head> 里那段内联脚本 —— 见该文件顶部说明。 -->
<script src="js/theme.js"></script>

<script src="js/trees.js"></script>

<!-- 只是观测数据的元信息（1 KB），供页脚日期与合成数据警示判断用。
     整份观测数据（observations.js，压缩后约 180 KB）推迟到图表区才下。
     两个文件由同一脚本、同一份数据生成，不会不一致。 -->
<script src="js/obs-meta.js"></script>

<!-- tree-info.js 必须在 chart.js 之前：chart.js 初始化时会用到下拉框与信息卡。
     它只依赖 trees.js，所以留在首屏。 -->
<script src="js/tree-info.js"></script>
<script src="js/gallery.js"></script>
<script src="js/network.js"></script>
<script src="js/data-source.js"></script>
<script src="js/footer-composition.js"></script>
<script src="js/changelog.js"></script>
<script src="js/nav.js"></script>

<!-- 放最后：它要等上面这些就位后，再按滚动位置去取地图与图表 -->
<script src="js/lazy-load.js"></script>

</body>
</html>
