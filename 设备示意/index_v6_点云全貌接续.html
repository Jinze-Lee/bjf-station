<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>森林观测设备与数据传输示意图 · 北京森林生态系统研究站</title>
<style>
  :root {
    --ink:       #1d3126;
    --ink-soft:  #4f685a;
    --ink-faint: #688273;
    --deep:      #1f6b45;
    --wifi:      #16857a;
    --wire:      #2478b4;
    --paper:     #f4f8f3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1760px; margin: 0 auto; padding: 24px 24px 28px; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap; margin-bottom: 4px;
  }
  header h1 {
    margin: 0; font-size: clamp(21px, 2vw, 27px);
    font-weight: 700; letter-spacing: .03em; color: var(--ink);
  }
  header p { margin: 5px 0 0; color: var(--ink-soft); font-size: 13.5px; }
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    font-size: 12.5px; color: var(--ink-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .legend .line-chip { width: 18px; height: 2.5px; border-radius: 2px; display: inline-block; }

  /* 舞台：严格按 2000×920 逻辑坐标等比缩放，照片与点云逐像素对齐 */
  .stage-wrap { overflow-x: auto; overflow-y: hidden; }
  .stage {
    position: relative;
    width: 100%;
    min-width: 1240px;
    aspect-ratio: 2000 / 920;
    margin: 4px 0 0;
    isolation: isolate;
  }
  .stage canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #sceneCanvas { z-index: 1; }
  #fxCanvas    { z-index: 3; }

  /* 实拍仪器抠图：只放干净原图，不叠乱点云；外圈柔白光晕防背景树干干扰 */
  .real-photo {
    position: absolute;
    z-index: 2;
    transform: translateX(-50%);
    width: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 0 10px rgba(244, 248, 243, .96))
            drop-shadow(0 0 18px rgba(244, 248, 243, .88))
            drop-shadow(0 6px 12px rgba(24, 52, 36, .18));
  }
  .real-photo.sapflow-patch {
    filter: drop-shadow(0 2px 8px rgba(24, 52, 36, .22));
  }

  /* 设备名称牌 */
  .plate {
    position: absolute;
    z-index: 4;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
  }
  .plate .tri {
    width: 0; height: 0; margin: 0 auto 3px;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-bottom: 7.5px solid var(--deep);
  }
  .plate .tri.wifi { border-bottom-color: var(--wifi); }
  .plate .tri.wire { border-bottom-color: var(--wire); }
  .plate .nm {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 5px;
    background: rgba(244, 248, 243, .90);
    font-size: 11.5px;
    font-weight: 600;
    color: #243b2e;
    line-height: 1.32;
    box-shadow: 0 1px 4px rgba(24, 52, 36, .08);
  }
  .plate .sub {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .plate .sub.wifi-tag { color: #146e64; }
  .plate .sub.wire-tag { color: #1f6599; }

  /* 右侧电脑（显示器 + 支架 + 底座 + 键盘，屏幕内实时滚动曲线） */
  .computer {
    position: absolute;
    z-index: 4;
    left: 91.2%;
    top: 45.5%;
    width: 14.2%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .monitor {
    width: 100%;
    padding: 9px 9px 13px;
    border-radius: 10px;
    background: linear-gradient(160deg, #344039, #18201b 74%);
    box-shadow: 0 16px 32px rgba(20, 44, 30, .24), inset 0 1px 0 rgba(255, 255, 255, .16);
  }
  .screen {
    background: #fbfdfb;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 16 / 10.6;
    display: flex;
    flex-direction: column;
  }
  .screen-bar {
    min-height: 24px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: #e9f2ea;
    border-bottom: 1px solid #d8e5da;
  }
  .screen-bar i {
    width: 4px; height: 4px; border-radius: 50%;
    background: #8fa998;
  }
  .screen-bar .url {
    margin-left: 3px;
    font-size: 11px;
    color: #496354;
  }
  .screen-bar .live-pill {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: #1f6b45;
  }
  .screen-bar .live-pill b {
    width: 6px; height: 6px; border-radius: 50%;
    background: #289e5a;
    display: inline-block;
  }
  .screen-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 8px 1px;
  }
  .screen-title {
    font-size: 11.5px;
    font-weight: 700;
    color: #1f3f2d;
  }
  .screen-sub {
    font-size: 11px;
    color: #4d6758;
  }
  .screen-chart {
    width: 100%;
    flex: 1 1 auto;
    display: block;
    margin-top: 1px;
  }
  .screen-legend {
    display: flex;
    gap: 10px;
    padding: 2px 8px 4px;
    font-size: 11px;
    color: #496354;
    border-top: 1px solid #edf3ee;
  }
  .screen-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .screen-legend i { width: 8px; height: 2.5px; border-radius: 1px; display: inline-block; }
  .monitor-neck {
    width: 9%;
    height: 14px;
    background: linear-gradient(180deg, #26312b, #434f47);
  }
  .monitor-foot {
    width: 38%;
    height: 6px;
    border-radius: 3px;
    background: #354039;
  }
  .monitor-keyboard {
    width: 78%;
    height: 12px;
    margin-top: 3px;
    border-radius: 3px;
    background: #eef4ef;
    border: 1px solid #c5d4c8;
    box-shadow: inset 0 2px 0 #dce7de, 0 4px 8px rgba(24, 52, 36, .10);
  }

  footer {
    margin-top: 14px;
    padding-top: 11px;
    border-top: 1px solid #dce7de;
    color: var(--ink-soft);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  @media (max-width: 900px) {
    .page { padding: 16px 12px 20px; }
    header h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <h1>森林观测设备与实时数据传输</h1>
      <p>实拍仪器嵌入点云森林，缺失的树冠、立杆与三脚架由点云补全；无线 WiFi 与有线数据线汇入采集箱，经 4G 实时传至电脑。</p>
    </div>
    <div class="legend" aria-label="图例">
      <span><i class="dot" style="background:#2f7a4f"></i>点云森林与补全结构</span>
      <span><i class="line-chip" style="background:#16857a"></i>无线 WiFi 传输</span>
      <span><i class="line-chip" style="background:#2478b4"></i>有线数据线传输</span>
    </div>
  </header>

  <div class="stage-wrap">
    <section class="stage" id="stage" aria-label="森林观测设备点云接续示意图">
      <canvas id="sceneCanvas" aria-hidden="true"></canvas>
      <div id="photoLayer"></div>
      <canvas id="fxCanvas" aria-hidden="true"></canvas>
      <div id="labelLayer"></div>

      <!-- 最右侧：电脑屏幕实时动态曲线 -->
      <div class="computer" aria-label="电脑屏幕实时观测曲线">
        <div class="monitor">
          <div class="screen">
            <div class="screen-bar">
              <i></i><i></i><i></i>
              <span class="url">bjf-station / live</span>
              <span class="live-pill"><b></b>LIVE</span>
            </div>
            <div class="screen-head">
              <span class="screen-title">森林站 · 实时数据</span>
              <span class="screen-sub">30 min 同步</span>
            </div>
            <svg class="screen-chart" viewBox="0 0 240 92" preserveAspectRatio="none" aria-hidden="true">
              <path d="M0 74H240M0 48H240M0 22H240" fill="none" stroke="#e6efe8" stroke-width="1" />
              <path id="areaA" fill="rgba(40, 120, 79, 0.10)" stroke="none" />
              <path id="liveA" fill="none" stroke="#28784f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
              <path id="liveB" fill="none" stroke="#2478b4" stroke-width="2.1" stroke-dasharray="4 2.5" stroke-linejoin="round" stroke-linecap="round" />
              <circle id="dotA" r="3.2" fill="#28784f" />
              <circle id="dotB" r="3.0" fill="#2478b4" />
            </svg>
            <div class="screen-legend">
              <span><i style="background:#28784f"></i>树干液流</span>
              <span><i style="background:#2478b4"></i>径向生长</span>
            </div>
          </div>
        </div>
        <div class="monitor-neck" aria-hidden="true"></div>
        <div class="monitor-foot" aria-hidden="true"></div>
        <div class="monitor-keyboard" aria-hidden="true"></div>
      </div>
    </section>
  </div>

  <footer>
    <span>无线 WiFi 组：气象环境、物候相机、能量平衡观测 → 采集箱网关；有线组：干湿沉降、树干液流/径向生长、土壤温湿盐、土壤温室气体、叶面积指数仪 → 采集箱。</span>
    <span>点云负责森林与照片截断处（树冠、立杆、三脚架、地下探头）的自然补全</span>
  </footer>

</div>

<script>
/* ==========================================================================
   森林观测设备与数据传输示意图 v6（点云全貌接续版）
   --------------------------------------------------------------------------
   核心原则：
   1. 仪器本身只用干净的实拍抠图（.real-photo），绝不用点云把仪器再画一遍。
   2. 点云只画“照片之外的剩余部分”：
      · 13 棵分层分枝点云树（远景淡绿雾化 + 近景左上受光体积树冠）
      · 树干液流照片（sapflow-band.webp）向上接出整冠点云大树，向下接出点云树根
      · 物候相机（dev2.webp）左下角卡箍向下接出点云立杆与斜撑到地面
      · 能量平衡涡度塔（dev3.webp）三脚架向下点云接续到地面
      · 土壤温湿盐（dev5.webp）向下接出土壤剖面四层点云探针
      · 数据采集箱素材（cabinet.webp）缩小，底部向下接出点云中轴立杆 + 三脚架
   3. 传输方式分明：
      · 气象环境、物候相机、能量平衡：顶部动态扩散 WiFi 波纹 + 无线信号弧汇入采集箱
      · 干湿沉降、液流/径向、土壤温湿盐、土壤温室气体、叶面积指数：蓝色数据线汇入采集箱
      · 采集箱经 4G 无线传至右侧电脑，屏幕内双曲线每帧平滑实时推进
   ========================================================================== */
(function () {
  'use strict';

  var W = 2000, H = 920;
  var GROUND = 720;
  var BUS_Y = 808;

  var stage = document.getElementById('stage');
  var sceneCanvas = document.getElementById('sceneCanvas');
  var fxCanvas = document.getElementById('fxCanvas');
  var sctx = sceneCanvas.getContext('2d');
  var fctx = fxCanvas.getContext('2d');
  var photoLayer = document.getElementById('photoLayer');
  var labelLayer = document.getElementById('labelLayer');

  /* 固定种子随机数 */
  function seeded(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function mix(c1, c2, k) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * k),
      Math.round(c1[1] + (c2[1] - c1[1]) * k),
      Math.round(c1[2] + (c2[2] - c1[2]) * k)
    ];
  }

  /* ========================================================================
     1. 9 张实拍图配置（严格用 2000×920 逻辑坐标，去除了根系原位 dev7 和旧树皮 dev8）
     ======================================================================== */
  var ITEMS = [
    {
      id: 'climate', name: '大气气候与环境集成', sub: '无线 WiFi', mode: 'wireless',
      src: 'img/dev1.webp', ar: 0.633, cx: 135, yTop: 430, h: 225,
      wifi: [152, 412]
    },
    {
      id: 'phenology', name: '植物生长节律', sub: '物候相机 · 无线 WiFi', mode: 'wireless',
      src: 'img/dev2.webp', ar: 0.947, cx: 315, yTop: 452, h: 116,
      wifi: [336, 434]
    },
    {
      id: 'flux', name: '生态系统能量平衡观测', sub: '涡度相关 · 无线 WiFi', mode: 'wireless',
      src: 'img/dev3.webp', ar: 0.440, cx: 492, yTop: 382, h: 262,
      wifi: [492, 362]
    },
    {
      id: 'deposition', name: '干湿沉降采样系统', sub: '有线数据线', mode: 'wired',
      src: 'img/dev4.webp', ar: 0.904, cx: 668, yTop: 522, h: 174,
      wireX: 668, wireY0: 718
    },
    {
      id: 'sapflow', name: '液流与径向生长', sub: '树干传感器 · 有线', mode: 'wired',
      src: 'img/sapflow-band.webp', ar: 0.250, cx: 855, yTop: 472, h: 184,
      patch: true, wireX: 855, wireY0: 720
    },
    {
      id: 'soil', name: '土壤温湿盐自动观测', sub: '有线数据线', mode: 'wired',
      src: 'img/dev5.webp', ar: 0.244, cx: 1015, yTop: 482, h: 196,
      wireX: 1020, wireY0: 720
    },
    {
      id: 'ghg', name: '土壤温室气体自动观测', sub: '有线数据线', mode: 'wired',
      src: 'img/dev6.webp', ar: 0.906, cx: 1165, yTop: 556, h: 158,
      wireX: 1165, wireY0: 720
    },
    {
      id: 'lai', name: '分布式叶面积指数仪', sub: '有线数据线', mode: 'wired',
      src: 'img/dev9.webp', ar: 0.574, cx: 1325, yTop: 502, h: 182,
      wireX: 1325, wireY0: 720
    },
    {
      id: 'cabinet', name: '数据采集箱', sub: '组网 · 数采 · 太阳能 · 4G', mode: 'hub',
      src: 'img/cabinet.webp', ar: 1.307, cx: 1540, yTop: 454, h: 146
    }
  ];

  /* 挂载干净的实拍 <img> 与底部对齐名称牌 */
  ITEMS.forEach(function (d) {
    var img = document.createElement('img');
    img.className = 'real-photo' + (d.patch ? ' sapflow-patch' : '');
    img.dataset.id = d.id;
    img.src = d.src;
    img.alt = d.name;
    img.style.left = (d.cx / W * 100).toFixed(3) + '%';
    img.style.top = (d.yTop / H * 100).toFixed(3) + '%';
    img.style.height = (d.h / H * 100).toFixed(3) + '%';
    photoLayer.appendChild(img);

    var pl = document.createElement('div');
    pl.className = 'plate';
    pl.style.left = (d.cx / W * 100).toFixed(3) + '%';
    /* 树干液流标签贴在树干下方地面处，和其它设备成一行 */
    pl.style.top = (738 / H * 100).toFixed(2) + '%';
    var triCls = d.mode === 'wireless' ? 'tri wifi' : (d.mode === 'wired' ? 'tri wire' : 'tri');
    var subCls = d.mode === 'wireless' ? 'sub wifi-tag' : (d.mode === 'wired' ? 'sub wire-tag' : 'sub');
    pl.innerHTML =
      '<div class="' + triCls + '"></div>' +
      '<div class="nm">' + d.name + '<span class="' + subCls + '">' + d.sub + '</span></div>';
    labelLayer.appendChild(pl);
  });

  /* ========================================================================
     2. 点云树生成器（沿用认可的分层分枝 + 椭球叶团 + 左上受光 + 远景雾化算法）
     ======================================================================== */
  var HAZE = [220, 235, 221];
  var WOOD = [108, 90, 72];
  var LEAF = [56, 114, 64];

  function makeTree(h, seed, haze, customTrunkW) {
    var rnd = seeded(seed);
    var pts = [], wood = [], tips = [];
    var startW = customTrunkW || (h * 0.036);

    (function br(x, y, ang, len, w, d) {
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      wood.push([x, y, x2, y2, w]);
      if (d <= 0 || len < h * 0.028) { tips.push([x2, y2, w]); return; }
      var n = rnd() < 0.34 ? 3 : 2;
      for (var i = 0; i < n; i++) {
        br(x2, y2,
          ang + (i - (n - 1) / 2) * (0.46 + rnd() * 0.28) + (rnd() - 0.5) * 0.18,
          len * (0.71 + rnd() * 0.09), w * 0.66, d - 1);
      }
    })(0, 0, -Math.PI / 2 + (rnd() - 0.5) * 0.07, h * 0.30, startW, 6);

    wood.forEach(function (s) {
      var L = Math.hypot(s[2] - s[0], s[3] - s[1]);
      var n = Math.max(2, Math.round(L / 2.1));
      for (var i = 0; i <= n; i++) {
        var t = i / n, x = s[0] + (s[2] - s[0]) * t, y = s[1] + (s[3] - s[1]) * t;
        var w = Math.max(0.7, s[4] * (1 - t * 0.32));
        var k = Math.max(1, Math.round(w * 1.55));
        for (var j = 0; j < k; j++) {
          var a = rnd() * 6.2832, r = Math.pow(rnd(), 0.5) * w;
          pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r, 0.85 + rnd() * 0.65, 0]);
        }
      }
    });

    var spread = h * 0.090;
    tips.forEach(function (p) {
      for (var i = 0; i < 86; i++) {
        var a = rnd() * 6.2832, u = rnd() * 2 - 1, rr = Math.pow(rnd(), 0.43);
        var s = Math.sqrt(1 - u * u) * rr * spread;
        pts.push([
          p[0] + Math.cos(a) * s,
          p[1] + Math.sin(a) * s * 0.80 + u * spread * 0.54,
          0.85 + rnd() * 0.75, 1
        ]);
      }
    });

    var ys = pts.map(function (p) { return p[1]; });
    var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
    var xs = pts.map(function (p) { return p[0]; });
    var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    var pad = 4, dpr = Math.min(2, window.devicePixelRatio || 1);
    var cw = Math.ceil(xMax - xMin + pad * 2), ch = Math.ceil(yMax - yMin + pad * 2);
    var off = document.createElement('canvas');
    off.width = Math.ceil(cw * dpr); off.height = Math.ceil(ch * dpr);
    var oc = off.getContext('2d');
    oc.setTransform(dpr, 0, 0, dpr, 0, 0);

    var tint = rnd() - 0.5;
    var leafA = [LEAF[0] + tint * 38, LEAF[1] - Math.abs(tint) * 8, LEAF[2] + tint * 28];
    var leafB = [122 + tint * 34, 168, 100 + tint * 24];
    var cx0 = 0, cy0 = -h * 0.62, cr0 = h * 0.45;

    pts.forEach(function (p) {
      var t = (p[1] - yMax) / (yMin - yMax || 1);
      var col = (p[3] === 0)
        ? mix(WOOD, [144, 126, 106], t * 0.68 + rnd() * 0.15)
        : mix(leafA, leafB, t * 0.52 + rnd() * 0.35);
      if (p[3] === 1) {
        var lit = 1 - 0.28 * ((p[0] - cx0) / cr0 * 0.6 + (p[1] - cy0) / cr0 * 0.8);
        col = [col[0] * lit, col[1] * lit, col[2] * lit];
      }
      if (haze) { col = mix(col, HAZE, haze); }
      oc.fillStyle = 'rgb(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ')';
      oc.beginPath();
      oc.arc(p[0] - xMin + pad, p[1] - yMin + pad, p[2], 0, 6.2832);
      oc.fill();
    });
    return { canvas: off, ox: xMin - pad, oy: yMin - pad, w: cw, h: ch, pointCount: pts.length };
  }

    for (var q = 0; q < 2; q++) {
      var u4 = (el * 0.32 + q * 0.5) % 1;
      var p4 = quadPt(GATEWAY_ANT, c4g, PC_ANT, u4);
      var a4 = quadAngle(GATEWAY_ANT, c4g, PC_ANT, u4);
      drawWavePacket(fctx, p4[0], p4[1], a4, 0.35 + 0.65 * Math.sin(u4 * Math.PI), '36, 120, 180');
    }
  }

  /* ========================================================================
     6. 电脑屏幕内的平滑实时滚动曲线
     ======================================================================== */
  var pathA = document.getElementById('liveA');
  var areaA = document.getElementById('areaA');
  var pathB = document.getElementById('liveB');
  var dotA  = document.getElementById('dotA');
  var dotB  = document.getElementById('dotB');
  var liveTicks = 0;

  function updateLiveChart(el) {
    var N = 54;
    var dA = '', dB = '', lastYa = 45, lastYb = 50;
    for (var i = 0; i < N; i++) {
      var x = (i / (N - 1)) * 234;
      var phase = el * 1.65 + i * 0.22;
      var ya = 46 + Math.sin(phase) * 16 + Math.sin(phase * 2.3) * 5.5;
      var yb = 52 + Math.cos(phase * 0.85 + 0.8) * 14 + Math.sin(phase * 1.9) * 4.5;
      dA += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + ya.toFixed(1);
      dB += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + yb.toFixed(1);
      if (i === N - 1) { lastYa = ya; lastYb = yb; }
    }
    pathA.setAttribute('d', dA);
    areaA.setAttribute('d', dA + ' L234 88 L0 88 Z');
    pathB.setAttribute('d', dB);
    dotA.setAttribute('cx', '234'); dotA.setAttribute('cy', lastYa.toFixed(1));
    dotB.setAttribute('cx', '234'); dotB.setAttribute('cy', lastYb.toFixed(1));
    liveTicks++;
  }

  /* ========================================================================
     7. 主循环与自动化自检接口 window.SceneV6
     ======================================================================== */
  window.SceneV6 = {
    treeCount: FAR_TREES.length + NEAR_TREES.length + 1,
    heroTreePoints: heroTrunkPointCount,
    cabinetTripodPoints: tripodPointCount,
    wirelessIds: WIRELESS_ARCS.map(function (a) { return a.id; }),
    wiredIds: WIRED_LIST.map(function (d) { return d.id; }),
    liveChartTicks: 0
  };

  function tick(now) {
    var el = (now - t0) / 1000;
    drawSceneLayer(el);
    drawFxLayer(el);
    updateLiveChart(el);
    window.SceneV6.liveChartTicks = liveTicks;
    requestAnimationFrame(tick);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(tick);
})();
</script>
