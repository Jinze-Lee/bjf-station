<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设备布设与数据传输示意图 · 北京森林生态系统研究站</title>
<style>
  :root {
    --ink:      #22322a;
    --ink-soft: #5d7268;
    --line:     #c6d6c9;
    --leaf:     #2f7a4f;
    --data:     #2a7fb8;
    --bg:       #f7faf7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1680px; margin: 0 auto; padding: 26px 26px 40px; }

  header h1 {
    margin: 0 0 6px;
    font-size: 25px;
    letter-spacing: .5px;
  }
  header p { margin: 0; color: var(--ink-soft); font-size: 14px; }
  header .en { color: #93a79b; font-size: 12.5px; letter-spacing: .3px; }

  /* 画布舞台：内部一律按 1800×900 的比例摆，随宽度等比缩放 */
  /* 画布舞台：内部一律按 1800×780 的比例摆，随宽度等比缩放；
     窄屏不压缩图，改为横向滚动，避免标签叠在一起 */
  .stage-wrap { overflow-x: auto; overflow-y: hidden; }
  .stage {
    position: relative;
    width: 100%;
    min-width: 1200px;
    aspect-ratio: 1800 / 780;
    margin: 14px 0 0;
  }
  .stage canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  /* 地面线 */
  .stage .ground {
    position: absolute; left: 3%; width: 54%;
    bottom: 12.8%; height: 0;
    border-top: 1.5px dashed var(--line);
  }
  /* 实拍照片（抠过主体，直接立在“地面”上） */
  .ph {
    position: absolute; bottom: 12.8%;
    width: auto; height: auto;
    filter: drop-shadow(0 10px 14px rgba(30, 60, 42, .16));
  }
  .ph.trunk   { left: 2.2%;  height: 51.3%; }
  .ph.met     { left: 17.2%; height: 32%; }
  .ph.tripod  { left: 27.8%; height: 32%; }
  .ph.cabinet { left: 57.2%; height: 38.5%; }

  /* 标签 */
  .lbl {
    position: absolute;
    transform: translateX(-50%);
    text-align: center;
    line-height: 1.35;
    white-space: nowrap;
    color: var(--ink);
  }
  .lbl b { display: block; font-size: 15.5px; font-weight: 600; }
  .lbl i { font-style: normal; font-size: 11.5px; color: #8ea296; letter-spacing: .2px; }
  .lbl small { display: block; font-size: 12.5px; color: var(--ink-soft); }

  /* 设备名标签（照片下方） */
  .tag {
    position: absolute;
    transform: translateX(-50%);
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .82);
    border: 1px solid #dbe7dd;
    font-size: 13px;
    color: #2f4a3a;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(30, 60, 42, .06);
  }
  .tag em { font-style: normal; color: #93a79b; font-size: 11px; margin-left: 5px; }

  /* 右侧：云端 / 网页实时展示 */
  .card {
    position: absolute;
    left: 85%; bottom: 12%; width: 14.2%; height: 52%;
    border: 1px solid #dbe7dd;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 8px 22px rgba(30, 60, 42, .07);
    padding: 12px 12px 10px;
    display: flex; flex-direction: column;
  }
  .card h4 { margin: 0 0 2px; font-size: 14px; }
  .card .en2 { font-size: 10.5px; color: #a3b5aa; letter-spacing: .2px; }
  .card .cloudglyph { margin: 6px 0 2px; }
  .card .chart { flex: 1 1 auto; margin: 2px 0 0; }
  .card .note {
    font-size: 11px; color: #8ea296; line-height: 1.4;
    border-top: 1px dashed #e3ece5; padding-top: 7px; margin-top: 4px;
  }

  /* 链路说明气泡 */
  .pill {
    position: absolute; transform: translate(-50%, -50%);
    padding: 3px 10px; border-radius: 999px;
    background: #fff; border: 1px solid #d7e6f2;
    color: #22628f; font-size: 12.5px; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(42, 127, 184, .10);
  }

  footer {
    margin-top: 18px; padding-top: 12px;
    border-top: 1px solid #e3ece5;
    color: #8ea296; font-size: 12.5px;
  }
  footer .legend { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  footer .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  @media (max-width: 1349px) {
    /* 图变窄时先收起标签里的次要文字，避免与相邻标签叠字 */
    .tag em { display: none; }
  }
  @media (max-width: 900px) {
    .page { padding: 16px 12px 26px; }
    header h1 { font-size: 19px; }
    .tag { font-size: 11px; padding: 2px 7px; }
    .card h4 { font-size: 11px; }
    .card .note { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>设备布设与数据传输</h1>
    <p>现场设备采集 → 采集箱汇总 → 4G 组网上传 → 云端 → 网页实时曲线<span class="en">　Field sensors → Data logger → 4G network → Cloud → Live web charts</span></p>
  </header>

  <div class="stage-wrap">
  <div class="stage" id="stage">
    <!-- 点阵树 + 流动数据（画在最底层） -->
    <canvas id="dots"></canvas>
    <div class="ground"></div>

    <img class="ph trunk"   src="img/trunk.webp"   alt="树干径向生长仪与液流传感器" />
    <img class="ph met"     src="img/met.webp"     alt="微气象站" />
    <img class="ph tripod"  src="img/tripod.webp"  alt="三脚架数据采集箱" />
    <img class="ph cabinet" src="img/cabinet.webp" alt="数据采集箱内部模块" />

    <!-- 设备名 -->
    <div class="tag" style="left: 9.5%;  top: 30%;">径向生长仪 / 液流<em>每 30 分钟</em></div>
    <div class="tag" style="left: 21.3%; top: 50%;">微气象站</div>
    <div class="tag" style="left: 30.8%; top: 50%;">采集箱</div>
    <div class="tag" style="left: 71.5%; top: 43%;">数据采集箱<em>组网 · 数采 · 太阳能 · 4G</em></div>

    <!-- 链路说明 -->
    <div class="pill" style="left: 40%; top: 84%;">数据汇入采集箱</div>
    <div class="pill" style="left: 82%; top: 34%;">4G 上传</div>

    <!-- 右侧云端 / 网页 -->
    <div class="card">
      <h4>云端 · 网页实时展示</h4>
      <div class="en2">Cloud &amp; live charts</div>
      <svg class="cloudglyph" viewBox="0 0 100 40" height="30" aria-hidden="true">
        <path d="M26 32h46a11 11 0 0 0 0-22 15 15 0 0 0-28-4 12 12 0 0 0-18 26z"
              fill="#eaf3f9" stroke="#8fbcd8" stroke-width="1.6" />
      </svg>
      <svg class="chart" viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline stroke="#2f7a4f" stroke-width="2.2"
            points="6,96 26,88 46,80 66,72 86,60 106,52 126,40 146,32 166,24 194,18" />
          <polyline stroke="#2a7fb8" stroke-width="2.2" stroke-dasharray="4 3"
            points="6,66 26,72 46,58 66,64 86,46 106,54 126,36 146,44 166,28 194,34" />
        </g>
        <line x1="4" y1="112" x2="196" y2="112" stroke="#e0eae2" stroke-width="1.4" />
      </svg>
      <div class="note">与网站图表同源的真实数据<br /><span style="color:#a3b5aa">液流 · 径向生长 · 环境要素</span></div>
    </div>
  </div>
  </div>

  <footer>
    <div class="legend">
      <span><i class="dot" style="background:#2f7a4f"></i>点阵树：样地林木</span>
      <span><i class="dot" style="background:#2a7fb8"></i>蓝点：数据流向</span>
      <span>照片为实地拍摄，抠出主体后嵌入示意图</span>
    </div>
  </footer>

</div>

<script>
/* ==========================================================================
   设备示意页：点阵树 + 数据流
   --------------------------------------------------------------------------
   · 点阵树按固定种子生成（每次刷新形状一致），从根部往外“长”出来，
     再随时间轻微摆动；照片压在点阵之上，靠照片之间的留白把树“接”起来。
   · 蓝点沿地面线流向采集箱，再从采集箱流向右侧云端卡片。
   · 全部按 1800×900 的逻辑坐标画，画布随舞台尺寸等比缩放。
   ========================================================================== */
(function () {
  'use strict';

  var W = 1800, H = 780;                  /* 逻辑坐标 */
  var stage = document.getElementById('stage');
  var cv = document.getElementById('dots');
  var ctx = cv.getContext('2d');

  /* 固定种子的随机数，保证树形每次一致 */
  function seeded(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- 生成点阵树 ---------- */
  var SHADES = ['#2b6b46', '#337a4f', '#418a5c', '#57996d', '#74ad86'];
  var BASE = { x: 700, y: 682 };
  var dots = [], maxDist = 1;

  (function buildTree() {
    var rnd = seeded(20261018);
    var tips = [], segs = [];

    (function branch(x, y, ang, len, w, d) {
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      segs.push([x, y, x2, y2, w, d]);
      if (d <= 0 || len < 13) { tips.push([x2, y2, w]); return; }
      var n = rnd() < 0.3 ? 3 : 2;
      for (var i = 0; i < n; i++) {
        branch(x2, y2,
          ang + (i - (n - 1) / 2) * (0.52 + rnd() * 0.36) + (rnd() - 0.5) * 0.2,
          len * (0.73 + rnd() * 0.1), w * 0.68, d - 1);
      }
    })(BASE.x, BASE.y, -Math.PI / 2 + 0.05, 137, 9, 7);

    /* 枝条上的点 */
    segs.forEach(function (s) {
      var L = Math.hypot(s[2] - s[0], s[3] - s[1]);
      var n = Math.max(1, Math.round(L / 6.5));
      for (var i = 0; i <= n; i++) {
        var t = i / n;
        push(s[0] + (s[2] - s[0]) * t, s[1] + (s[3] - s[1]) * t,
             Math.max(0.9, s[4] * 0.46), s[5]);
      }
    });

    /* 枝头的“叶”点阵 */
    tips.forEach(function (p) {
      var spread = 9 + p[2] * 2.6;
      for (var i = 0; i < 9; i++) {
        var a = rnd() * Math.PI * 2, r = Math.pow(rnd(), 0.6) * spread;
        push(p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r, 0.9 + rnd() * 1.5, 0);
      }
    });

    function push(x, y, r, depth) {
      var d = Math.hypot(x - BASE.x, y - BASE.y);
      if (d > maxDist) { maxDist = d; }
      dots.push({
        x: x, y: y, r: r,
        c: SHADES[Math.min(SHADES.length - 1, depth || 0)],
        a: 0.55 + (depth || 0) * 0.06,
        dist: d
      });
    }
  })();

  /* ---------- 数据流路径 ---------- */
  var PATHS = [
    /* 地面线：样地 -> 采集箱 */
    [[60, 682], [420, 682], [760, 682], [1030, 682]],
    /* 采集箱 -> 云端卡片 */
    [[1422, 520], [1480, 455], [1518, 430]]
  ];

  /* ---------- 绘制 ---------- */
  var scale = 1, dpr = Math.min(2, window.devicePixelRatio || 1);
  var t0 = performance.now();

  function resize() {
    var w = stage.clientWidth || 1;
    scale = w / W;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * (H / W) * dpr);
  }

  function frame(now) {
    var el = (now - t0) / 1000;
    var grow = Math.min(1, el / 2.6);            /* 树长出来的进度 */
    var sway = Math.sin(el * 0.55) * 0.011;      /* 轻微摆动 */

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.clearRect(0, 0, W, H);

    /* 点阵树 */
    ctx.save();
    ctx.translate(BASE.x, BASE.y);
    ctx.rotate(sway);
    ctx.translate(-BASE.x, -BASE.y);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var appear = (grow - d.dist / maxDist * 0.85) / 0.15;
      if (appear <= 0) { continue; }
      ctx.globalAlpha = Math.min(1, appear) * d.a;
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    /* 蓝点：沿路径流动 */
    PATHS.forEach(function (pts, pi) {
      var segs = [], total = 0;
      for (var j = 1; j < pts.length; j++) {
        var L = Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]);
        segs.push(L); total += L;
      }
      var COUNT = Math.max(3, Math.round(total / 62));
      for (var k = 0; k < COUNT; k++) {
        var p = ((el * 0.16 + k / COUNT + pi * 0.3) % 1) * total;
        var acc = 0, seg = 0;
        while (seg < segs.length - 1 && acc + segs[seg] < p) { acc += segs[seg]; seg++; }
        var u = segs[seg] ? (p - acc) / segs[seg] : 0;
        var x = pts[seg][0] + (pts[seg + 1][0] - pts[seg][0]) * u;
        var y = pts[seg][1] + (pts[seg + 1][1] - pts[seg][1]) * u;
        ctx.globalAlpha = 0.25 + 0.75 * Math.sin(u * Math.PI);
        ctx.fillStyle = '#2a7fb8';
        ctx.beginPath();
        ctx.arc(x, y, 3.1, 0, 6.2832);
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
