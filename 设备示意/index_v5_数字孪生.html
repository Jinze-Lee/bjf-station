<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>森林观测设备 · 点云数字孪生</title>
  <style>
    :root {
      --ink: #18372b;
      --muted: #526e5e;
      --green: #28784f;
      --signal: #247cac;
      --paper: #f4f8f2;
      --line: #b9d0c1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1740px; margin: 0 auto; padding: 25px 24px 26px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    h1 { margin: 0; font-size: clamp(21px, 2vw, 29px); letter-spacing: .02em; font-weight: 700; }
    .intro { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .key { display: flex; gap: 15px; align-items: center; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .key i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; vertical-align: 1px; }

    .scene-scroll { overflow-x: auto; overflow-y: hidden; }
    .scene {
      position: relative;
      width: 100%; min-width: 1240px;
      aspect-ratio: 2200 / 1100;
      margin-top: 8px;
      isolation: isolate;
    }
    .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #clouds { z-index: 1; }
    #signals { z-index: 2; pointer-events: none; }
    #labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

    .label {
      position: absolute; transform: translate(-50%, -50%);
      color: #294b39; font-size: 12px; line-height: 1.3;
      text-align: center; white-space: nowrap;
      padding: 2px 5px; border-radius: 4px;
      background: rgba(244,248,242,.82);
      text-shadow: 0 1px 3px rgba(244,248,242,.7);
    }
    .label strong { font-weight: 650; }
    .label small { display: block; color: #536e5f; font-size: 11px; }
    .label.sensor { color: #245a49; }

    /* 最右侧：真正的电脑，屏幕里是网站实时数据 */
    .computer {
      position: absolute; z-index: 4;
      left: 86.2%; top: 33.5%; width: 13.6%;
      display: flex; flex-direction: column; align-items: center;
    }
    .monitor {
      width: 100%; padding: 11px 11px 16px;
      background: linear-gradient(160deg, #333e37, #161d19 72%);
      border-radius: 11px;
      box-shadow: 0 18px 34px rgba(24, 52, 36, .26), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .screen {
      position: relative; overflow: hidden;
      background: #fbfdfb; border-radius: 3px;
      aspect-ratio: 16 / 10.4;
      display: flex; flex-direction: column;
    }
    .screen-bar {
      min-height: 26px; display: flex; align-items: center; gap: 4px;
      padding: 4px 9px; background: #eaf2eb; border-bottom: 1px solid #dce8de;
    }
    .screen-bar i { width: 4px; height: 4px; border-radius: 50%; background: #9db3a4; }
    .screen-bar span { margin-left: 4px; font-size: 11px; color: #4f685a; }
    .live { margin-left: auto; display: flex; align-items: center; gap: 3px; font-size: 11px; color: #276a44; letter-spacing: .08em; }
    .live b { width: 6px; height: 6px; border-radius: 50%; background: #2fa05e; }
    .screen-title { padding: 6px 9px 0; font-size: 12px; font-weight: 700; color: #244b36; }
    .screen-sub { padding: 0 9px; font-size: 11px; color: #4f685a; }
    .screen-chart { display: block; width: 100%; flex: 1 1 auto; margin-top: 2px; }
    .screen-legend { display: flex; gap: 8px; padding: 2px 9px 5px; font-size: 11px; color: #4b6556; }
    .screen-legend i { display: inline-block; width: 7px; height: 2px; margin-right: 3px; vertical-align: 2px; }
    .monitor-neck { width: 9%; height: 15px; background: linear-gradient(180deg, #2b3630, #465046); }
    .monitor-foot { width: 38%; height: 6px; border-radius: 3px; background: #3a443c; }
    .monitor-keyboard {
      width: 80%; height: 14px; margin-top: 3px; border-radius: 3px;
      background: #eef4ef;
      border: 1px solid #c9d6cb;
      box-shadow: inset 0 2px 0 #dbe6dc, 0 4px 8px rgba(24, 52, 36, .10);
    }

    .flow-note {
      position: absolute; z-index: 4; left: 82.5%; top: 38.5%;
      color: #2a739b; font-size: 11px; letter-spacing: .04em;
      text-shadow: 0 1px 5px var(--paper), 0 0 8px var(--paper);
    }
    footer {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      margin-top: 10px; padding-top: 11px; border-top: 1px solid #dce8de;
      color: #526d5c; font-size: 11.5px;
    }
    @media (max-width: 900px) {
      .page { padding: 17px 12px 20px; }
      header { align-items: start; flex-direction: column; gap: 8px; }
      .key { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { #signals { visibility: hidden; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>森林观测设备：从实物到实时数据</h1>
        <p class="intro">现场仪器以点云数字孪生呈现，实拍部件嵌回对应位置；土壤类与液流经数据线汇入采集箱，气象、物候、能量平衡经网关 4G 无线回传。</p>
      </div>
      <div class="key" aria-label="图例">
        <span><i style="background:#398255"></i>点云仪器与森林</span>
        <span><i style="background:#2a7fb8"></i>数据线</span>
        <span><i style="background:#2a9a64"></i>无线 WiFi</span>
        <span><i style="background:#d9a768"></i>实拍部件</span>
      </div>
    </header>

    <div class="scene-scroll">
      <section class="scene" id="scene" aria-label="森林观测设备点云示意图">
        <canvas id="clouds" aria-hidden="true"></canvas>
        <canvas id="signals" aria-hidden="true"></canvas>
        <div id="labels"></div>

        <div class="flow-note">4G · 实时回传</div>
        <div class="computer" aria-label="电脑屏幕上的网站实时数据">
          <div class="monitor">
            <div class="screen">
              <div class="screen-bar">
                <i></i><i></i><i></i><span>bjf-station / data</span>
                <span class="live"><b></b>LIVE</span>
              </div>
              <div class="screen-title">森林站 · 实时观测</div>
              <div class="screen-sub">液流　茎干生长　环境要素</div>
              <svg class="screen-chart" viewBox="0 0 240 100" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 84H240M0 56H240M0 28H240" fill="none" stroke="#e5eee6" stroke-width="1"/>
                <path id="liveA" fill="none" stroke="#28784f" stroke-width="2.6" stroke-linejoin="round"/>
                <path id="liveB" fill="none" stroke="#247cac" stroke-width="2.2" stroke-linejoin="round"/>
              </svg>
              <div class="screen-legend">
                <span><i style="background:#28784f"></i>液流</span>
                <span><i style="background:#247cac"></i>径向生长</span>
              </div>
            </div>
          </div>
          <div class="monitor-neck" aria-hidden="true"></div>
          <div class="monitor-foot" aria-hidden="true"></div>
          <div class="monitor-keyboard" aria-hidden="true"></div>
        </div>
      </section>
    </div>

    <footer>
      <span>点云结构按照片与公开仪器构成资料分别重建；照片保留为独立实物贴片，不由照片像素转换。</span>
      <span>仪器名称按老师展板标注</span>
    </footer>
  </main>
  <script>
    /* 屏幕上两条曲线实时滚动：模拟网站每秒刷新的观测序列 */
    (function () {
      var A = document.getElementById('liveA');
      var B = document.getElementById('liveB');
      if (!A || !B) return;
      var N = 64, a = [], b = [], t = 0;
      function clamp(v) { return Math.max(6, Math.min(94, v)); }
      for (var i = 0; i < N; i++) {
        a.push(clamp(54 + Math.sin(i * .21) * 13));
        b.push(clamp(48 + Math.cos(i * .17) * 15));
      }
      function line(arr) {
        var d = '', n = arr.length;
        for (var i = 0; i < n; i++) {
          d += (i ? ' L' : 'M') + (i / (n - 1) * 240).toFixed(1) + ' ' + arr[i].toFixed(1);
        }
        return d;
      }
      function draw() { A.setAttribute('d', line(a)); B.setAttribute('d', line(b)); }
      draw();
      setInterval(function () {
        t += .19;
        a.push(clamp(53 + Math.sin(t) * 15 + Math.sin(t * 2.7) * 4));
        b.push(clamp(49 + Math.cos(t * 1.25) * 16 + Math.sin(t * 3.2) * 3));
        a.shift(); b.shift();
        draw();
      }, 180);
    })();
  </script>
  <script src="device-twin.js"></script>
</body>
</html>
