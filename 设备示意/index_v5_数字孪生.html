<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>森林观测设备 · 点云数字孪生</title>
  <style>
    :root {
      --ink: #18372b;
      --muted: #526e5e;
      --green: #28784f;
      --signal: #247cac;
      --paper: #f4f8f2;
      --line: #b9d0c1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1740px; margin: 0 auto; padding: 25px 24px 26px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    h1 { margin: 0; font-size: clamp(21px, 2vw, 29px); letter-spacing: .02em; font-weight: 700; }
    .intro { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .key { display: flex; gap: 15px; align-items: center; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .key i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; vertical-align: 1px; }

    .scene-scroll { overflow-x: auto; overflow-y: hidden; }
    .scene {
      position: relative;
      width: 100%; min-width: 1240px;
      aspect-ratio: 2200 / 1100;
      margin-top: 8px;
      isolation: isolate;
    }
    .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #clouds { z-index: 1; }
    #signals { z-index: 2; pointer-events: none; }
    #labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

    .label {
      position: absolute; transform: translate(-50%, -50%);
      color: #294b39; font-size: 12px; line-height: 1.3;
      text-align: center; white-space: nowrap;
      padding: 2px 5px; border-radius: 4px;
      background: rgba(244,248,242,.82);
      text-shadow: 0 1px 3px rgba(244,248,242,.7);
    }
    .label strong { font-weight: 650; }
    .label small { display: block; color: #536e5f; font-size: 11px; }
    .label.sensor { color: #245a49; }

    /* 电脑端不是卡通电脑，而是网站实际到达的浏览器界面 */
    .browser {
      position: absolute; z-index: 4;
      left: 87.4%; top: 40%; width: 12.4%;
      min-width: 180px; aspect-ratio: 1.08 / 1;
      border: 1px solid #9eb8a8; border-radius: 8px;
      background: #fbfdfb; overflow: hidden;
      box-shadow: 0 12px 26px rgba(26, 63, 43, .16);
    }
    .browser-bar {
      height: 25px; display: flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-bottom: 1px solid #dce8de; background: #eaf2eb;
    }
    .browser-bar i { width: 5px; height: 5px; border-radius: 50%; background: #91ac99; }
    .browser-bar span { margin-left: 5px; color: #526d5c; font-size: 11px; }
    .web-title { padding: 7px 9px 2px; font-size: 12px; font-weight: 700; color: #244b36; }
    .web-sub { padding: 0 9px; font-size: 11px; color: #536e5f; }
    .web-chart { display: block; width: calc(100% - 16px); height: 48%; margin: 4px 8px 0; }
    .web-legend { display: flex; gap: 9px; padding: 3px 9px; color: #526d5c; font-size: 11px; }
    .web-legend i { display: inline-block; width: 8px; height: 2px; margin-right: 3px; vertical-align: 2px; }
    .monitor-stand { position: absolute; z-index: 4; left: 93.5%; top: 63%; width: 2px; height: 4%; background: #758b7d; }
    .monitor-foot { position: absolute; z-index: 4; left: 91.4%; top: 67%; width: 4.4%; height: 3px; border-radius: 3px; background: #758b7d; }

    .flow-note {
      position: absolute; z-index: 4; left: 82.5%; top: 38.5%;
      color: #2a739b; font-size: 11px; letter-spacing: .04em;
      text-shadow: 0 1px 5px var(--paper), 0 0 8px var(--paper);
    }
    footer {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      margin-top: 10px; padding-top: 11px; border-top: 1px solid #dce8de;
      color: #526d5c; font-size: 11.5px;
    }
    @media (max-width: 900px) {
      .page { padding: 17px 12px 20px; }
      header { align-items: start; flex-direction: column; gap: 8px; }
      .key { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { #signals { visibility: hidden; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>森林观测设备：从实物到实时数据</h1>
        <p class="intro">现场仪器以点云数字孪生呈现，实拍部件嵌回对应位置；数据汇入采集箱，经 4G 传至网页。</p>
      </div>
      <div class="key" aria-label="图例">
        <span><i style="background:#398255"></i>点云仪器与森林</span>
        <span><i style="background:#2a7fb8"></i>数据传输</span>
        <span><i style="background:#d9a768"></i>实拍部件</span>
      </div>
    </header>

    <div class="scene-scroll">
      <section class="scene" id="scene" aria-label="森林观测设备点云示意图">
        <canvas id="clouds" aria-hidden="true"></canvas>
        <canvas id="signals" aria-hidden="true"></canvas>
        <div id="labels"></div>

        <div class="flow-note">4G · 实时回传</div>
        <div class="browser" aria-label="网页实时数据面板">
          <div class="browser-bar"><i></i><i></i><i></i><span>bjf-station / data</span></div>
          <div class="web-title">森林站 · 实时观测</div>
          <div class="web-sub">液流　茎干生长　环境要素</div>
          <svg class="web-chart" viewBox="0 0 240 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 85H240M0 56H240M0 27H240" fill="none" stroke="#e5eee6" stroke-width="1"/>
            <path d="M4 78 C24 76 27 53 47 59 S73 79 92 53 S120 37 138 48 S170 59 187 29 S219 23 236 12"
                  fill="none" stroke="#28784f" stroke-width="2.4"/>
            <path d="M4 46 C25 39 33 57 51 48 S78 31 96 39 S120 64 141 48 S170 37 188 49 S216 59 236 43"
                  fill="none" stroke="#247cac" stroke-width="2" stroke-dasharray="5 3"/>
          </svg>
          <div class="web-legend"><span><i style="background:#28784f"></i>液流</span><span><i style="background:#247cac"></i>径向生长</span></div>
        </div>
        <div class="monitor-stand" aria-hidden="true"></div>
        <div class="monitor-foot" aria-hidden="true"></div>
      </section>
    </div>

    <footer>
      <span>点云结构按照片与公开仪器构成资料分别重建；照片保留为独立实物贴片，不由照片像素转换。</span>
      <span>仪器名称按老师展板标注</span>
    </footer>
  </main>
  <script src="device-twin.js"></script>
</body>
</html>
