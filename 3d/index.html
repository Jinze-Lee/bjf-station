			text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: auto; }
		#topbar .brand small { display:block; font-weight: 400; opacity: .72; font-size: 11px; letter-spacing: 0; }
		#topbar .spacer { flex: 1; }
		#topbar a.btn, #topbar button.btn {

			color: #e7e3d8; background: rgba(38,42,30,.72); border: 1px solid rgba(160,180,120,.35);
			border-radius: 6px; padding: 7px 13px; font-size: 13px; font-family: inherit;

		// WGS-84 -> GCJ-02（供高德小地图对齐用）
		var A = 6378245.0, EE = 0.00669342162296594323;
		function outOfChina(lat, lon){ return (lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271); }
		function tLat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
			r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
			r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
			r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r;}
		function tLon(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
			r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
			r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
			r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r;}
		function gcj(lat,lon){ if(outOfChina(lat,lon)) return [lat,lon];
			var dLat=tLat(lon-105,lat-35), dLon=tLon(lon-105,lat-35);
			var rad=lat/180*Math.PI, m=Math.sin(rad); m=1-EE*m*m; var sm=Math.sqrt(m);
			dLat=(dLat*180)/((A*(1-EE))/(m*sm)*Math.PI);
			dLon=(dLon*180)/(A/sm*Math.cos(rad)*Math.PI);
			return [lat+dLat, lon+dLon]; }

		proj4.defs('EPSG:32650', '+proj=utm +zone=50 +datum=WGS84 +units=m +no_defs');
		function utmToWgs84(E,N){ var p=proj4('EPSG:32650','EPSG:4326',[E,N]); return [p[1],p[0]]; } // [lat,lon]

		var viewer = new Potree.Viewer(document.getElementById('potree_render_area'));
		viewer.setEDLEnabled(true);
		/* 轮廓增强：只轻微加一点（金总：太黑了，稍微增强一点点就够） */
		try { viewer.setEDLRadius(1.6); viewer.setEDLStrength(1.15); } catch (e) {}
		viewer.setFOV(60);
		viewer.setPointBudget(3000000);   /* 先用低点数快速出图，加载完再逐步加密（见下方 rampBudget） */
		viewer.setDescription('');

		viewer.loadGUI(function () {

			try { $('#menu_map').hide(); $('#menu_map').next().hide(); } catch (e) {}

		// 相机：只有环绕（orbit）一种模式 —— 原来的第一人称「漫游」(WASD) 已去掉。
		// 中键拖动 = 平移（控制走向）；滚轮 = 固定步长缩放（原来是按当前距离的比例，远处快、近处慢）。
		(function () {
			var oc = viewer.orbitControls;
			if (!oc) return;
			// 滚轮：覆盖掉内置的「按距离比例」步长，改成固定步长（scrollStep 在点云载入后按场景半径设定）
			oc.addEventListener('mousewheel', function (e) {
				if (this.scrollStep) { this.radiusDelta = -e.delta * this.scrollStep; }
			});
			// 中键拖动 = 平移
			oc.addEventListener('drag', function (e) {
				if (e.drag.object !== null || e.drag.mouse !== 4) { return; }   // 4 = MIDDLE（e.buttons 位掩码）
				var el = this.renderer.domElement;
				this.panDelta.x += e.drag.lastDrag.x / el.clientWidth;
				this.panDelta.y += e.drag.lastDrag.y / el.clientHeight;
				this.stopTweens();
			});
		}());

		// 右上角图层控件：复选框开关（面板常开，点选即生效）

		/* 设备点总开关：直接驱动下面 5 个子勾选框（它们各自的处理逻辑照常执行） */
		(function bindDevAll() {
			var all = document.getElementById('chkDevAll');
			if (!all) { return; }
			var subs = ['chkMicro', 'chkFac', 'chkSap', 'chkDen', 'chkLai'];
			function sync() {
				var on = 0, total = 0;
				subs.forEach(function (id) {
					var e = document.getElementById(id);
					if (!e) { return; }
					total++;
					if (e.checked) { on++; }
				});
				all.checked = (on === total);
				all.indeterminate = (on > 0 && on < total);
			}
			all.addEventListener('change', function () {
				/* 先把目标值存下来：子框 change 会触发 sync() 改 all.checked，
				   直接在循环里读会中途变值，后几个子框就开不到（实测只开到第 3 个） */
				var want = all.checked;
				subs.forEach(function (id) {
					var e = document.getElementById(id);
					if (!e) { return; }
					if (e.checked !== want) {
						e.checked = want;
						e.dispatchEvent(new Event('change', { bubbles: true }));
					}
				});
				sync();
			});
			subs.forEach(function (id) {
				var e = document.getElementById(id);
				if (e) { e.addEventListener('change', sync); }
			});
			sync();
		}());
		bindChk('chkFac', function (v) { LBL_ON.fac = v; FAC_ON = v; });		bindChk('chkName', function (v) {

		/* 窄屏图层面板默认收起（跟二维地图一个做法：那边金总已经认了「默认折叠」），
		   点「图层」展开、点面板以外收起 —— 手机上别一直盖住三分之一屏幕。 */
		(function () {
			var box = document.getElementById('layersBox'), btn = document.getElementById('layersBtn'),
			    pan = document.getElementById('layersPanel');
			if (!box || !btn || !pan) return;
			function narrow() { return (window.innerWidth || 1024) < 640; }
			function setOpen(v) {
				pan.classList.toggle('open', v);
				btn.setAttribute('aria-expanded', v ? 'true' : 'false');
				btn.textContent = ((I18N[LANG] || {}).lLayers || '图层') + (v ? ' \u25be' : ' \u25b8');
			}
			setOpen(!narrow());                       /* 桌面默认展开；窄屏默认收起 */
			btn.addEventListener('click', function () { setOpen(!pan.classList.contains('open')); });
			/* 捕获阶段：Potree 的输入处理会吞掉冒泡，挂冒泡收不到 */
			document.addEventListener('pointerdown', function (e) {
				if (pan.classList.contains('open') && !box.contains(e.target)) setOpen(false);

			} else if (shape === 'diamond') {
				dctx.moveTo(0, -h); dctx.lineTo(h, 0); dctx.lineTo(0, h); dctx.lineTo(-h, 0); dctx.closePath();
			} else if (shape === 'square') {
				dctx.rect(-h, -h, s, s);
			} else if (shape === 'triangle') {
				dctx.moveTo(0, -h); dctx.lineTo(h, h * 0.85); dctx.lineTo(-h, h * 0.85); dctx.closePath();
			} else if (shape === 'hex') {
				for (i = 0; i < 6; i++) {
					a = -Math.PI / 2 + i * Math.PI / 3;
					if (i === 0) { dctx.moveTo(Math.cos(a) * h, Math.sin(a) * h); }
					else { dctx.lineTo(Math.cos(a) * h, Math.sin(a) * h); }
				}
				dctx.closePath();
			} else {
				dctx.arc(0, 0, h, 0, 6.2832);
			}
			dctx.fill(); dctx.stroke();
			dctx.restore();
		}
		/* 散点下面那根小柱子：把标记"插"到地面上，不然平铺在坡上会显得悬空 */
		function drawPin(x, y, color, len) {
			var L = len || 13;
			dctx.save();
			dctx.globalAlpha = 0.9; dctx.strokeStyle = color; dctx.lineWidth = 1.8;
			dctx.beginPath(); dctx.moveTo(x, y + 1); dctx.lineTo(x, y + L); dctx.stroke();
			dctx.globalAlpha = 0.55; dctx.fillStyle = color;
			dctx.beginPath();
			dctx.ellipse(x, y + L, 2.8, 1.4, 0, 0, 6.2832);
			dctx.fill();
			dctx.restore();
		}

		/* 标签底色用对应散点的颜色；亮色底自动配深字 */
		function fgOn(bg) {
			var m = /^#?([0-9a-f]{6})$/i.exec(bg || '');
			if (!m) { return '#fff'; }
			var v = parseInt(m[1], 16);
			var lum = 0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255);
			return lum >= 128 ? '#14170f' : '#fff';
		}
		function drawCrown(ring, V, P, color) {
			if (!ring || ring.length < 3) return;
			dctx.beginPath();
			for (var i = 0; i < ring.length; i++) {
				var s = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!s) return;
				if (i === 0) dctx.moveTo(s[0], s[1]); else dctx.lineTo(s[0], s[1]);
			}
			dctx.closePath();
			dctx.globalAlpha = 0.45; dctx.fillStyle = color; dctx.fill();
			dctx.globalAlpha = 0.9; dctx.strokeStyle = color; dctx.lineWidth = 1; dctx.stroke();
			dctx.globalAlpha = 1;
		}
		function drawRing(ring, V, P, fill, stroke, lw, alpha, close) {
			if (!ring || ring.length < 2) return;
			/* 相机进到多边形里面时必然有点在相机背后。原来碰到一个就整条不画 —— 大样地 500 m 见方，
			   飞进去整圈就没了。改成只画落在身前的段，碰到背后的顶点就断开（不断线到相机后面去）。 */
			dctx.beginPath();
			var started = false, drawn = 0;
			for (var i = 0; i < ring.length; i++) {
				var s = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!s) { started = false; continue; }
				if (started) { dctx.lineTo(s[0], s[1]); } else { dctx.moveTo(s[0], s[1]); started = true; }
				drawn++;
			}
			if (!drawn) return;
			if (close) dctx.closePath();
			if (fill) { dctx.globalAlpha = alpha; dctx.fillStyle = fill; dctx.fill(); }
			if (stroke) { dctx.globalAlpha = 1; dctx.strokeStyle = stroke; dctx.lineWidth = lw; dctx.stroke(); }
			dctx.globalAlpha = 1;
		}
		/* --- 生活区 / 林场 / 大样地 / 白桦林样地（3d/sites.json） ---
		 * 这几处都在样地 DEM 覆盖之外，高程只能等地形铺好（window.groundZ）再算，
		 * 所以这里做一次性缓存，顺便把名称标签挂上。 */
		var SITE3 = null;
		function ensureSiteZ() {
			if (SITE3 || !SITES || !window.groundZ) return;
			function gz(E, N) { var z = window.groundZ(E, N); return isFinite(z) ? z + 1.0 : null; }
			function ring(list) {
				if (gz(list[0][0], list[0][1]) == null) { return null; }
				var r = densifyLine(list, 5, gz);
				return r.length ? r : null;
			}
			var areas = [], points = [];
			(SITES.areas || []).forEach(function (a) {
				var r = ring(a.pts);
				if (r) areas.push({ id: a.id, nameZh: a.nameZh, name: a.name, ring: r });
			});
			(SITES.points || []).forEach(function (p) {
				var z = gz(p.E, p.N);
				if (z == null) return;
				points.push({ id: p.id, nameZh: p.nameZh, name: p.name, E: p.E, N: p.N, Z: z, alt: p.alt });
			});
			SITE3 = { areas: areas, points: points };

			/* 名称标签（与三个样地标签同一套样式）；文字按语言切换见 applyLang */
			areas.forEach(function (a) {
				var n = a.ring.length, ax = 0, ay = 0, az = 0;
				for (var i = 0; i < n; i++) { ax += a.ring[i][0]; ay += a.ring[i][1]; az += a.ring[i][2]; }
				var L = addLabel(ax / n, ay / n, az / n + 25, a.nameZh, 'log', null, a.name, '#4a9ec4');
				L.group = 'big';
				L.el.addEventListener('mousemove', function (ev) {
					showTip(ev, '<b>' + L.el.textContent + '</b>');
				});
			});
			points.forEach(function (p) {
				var isSta = (p.id === 'station');
				var L = addLabel(p.E, p.N, p.Z + 25, p.nameZh, isSta ? 'log station' : 'log',
					null, p.name, isSta ? '#b2df8a' : '#ffd400');
				L.group = 'site';
				L.el.addEventListener('mousemove', function (ev) {
					showTip(ev, '<b>' + L.el.textContent + '</b>' +
						(p.alt != null ? '<br>' + p.alt + ' m' : ''));
				});
			});
		}

		/* 把折线按 step 米加密，逐点取地形高程 —— 让样地框/格网贴着起伏的地表走，
		 * 而不是几个顶点之间拉直线（原来只有 5~7 个顶点，顺着坡看就发飘、扎地）。
		 * zFn 取不到值时退化为上一有效高程（再不行用原顶点高程），不会因为一个点失败整条不画。 */
		function densifyLine(list, step, zFn) {
			if (!list || list.length < 2 || !zFn) { return list; }
			var out = [], lastZ = null;
			function push(E, N, fallback) {
				var z = zFn(E, N);
				if (!isFinite(z)) { z = (lastZ != null) ? lastZ : fallback; }
				if (!isFinite(z)) { return; }
				lastZ = z;
				out.push([E, N, z]);
			}
			for (var i = 0; i < list.length - 1; i++) {
				var a = list[i], b = list[i + 1];
				var dx = b[0] - a[0], dy = b[1] - a[1];
				var n = Math.max(1, Math.ceil(Math.sqrt(dx * dx + dy * dy) / step));
				for (var k = 0; k < n; k++) {
					var t = k / n;
					push(a[0] + dx * t, a[1] + dy * t, a[2]);
				}
			}
			var L = list[list.length - 1];
			push(L[0], L[1], L[2]);
			return out;
		}
		/* 加密结果缓存：groundZ 会随 DEM 到位换一次（更准），换一次重算一次 */
		var BNDS_DENSE = null, BNDS_GZ = null;
		function bndRings(key) {
			if (window.groundZ && window.groundZ !== BNDS_GZ && BNDS) {
				BNDS_GZ = window.groundZ;
				BNDS_DENSE = {
					boundaries: (BNDS.boundaries || []).map(function (o) { return densifyLine(o.pts, 4, window.groundZ); }),
					grid20: (BNDS.grid20 || []).map(function (o) { return densifyLine(o.pts, 8, window.groundZ); }),
					grid40: (BNDS.grid40 || []).map(function (o) { return densifyLine(o.pts, 8, window.groundZ); })
				};
			}
			if (BNDS_DENSE) { return BNDS_DENSE[key]; }
			return (BNDS[key] || []).map(function (o) { return o.pts; });
		}

		/* 样地贴地透明大字：字号跟着样地在屏幕上的大小走（样地越大字越大） */
		function drawPlotText(ring, V, P, name, color, scale) {
			var n = ring.length, ok = true;
			var cx = 0, cy = 0, minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
			for (var i = 0; i < n; i++) {
				var q = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!q) { ok = false; break; }
				cx += q[0]; cy += q[1];
				if (q[0] < minx) { minx = q[0]; }
				if (q[0] > maxx) { maxx = q[0]; }
				if (q[1] < miny) { miny = q[1]; }
				if (q[1] > maxy) { maxy = q[1]; }
			}
			if (!ok || n < 3) { return; }
			cx /= n; cy /= n;
			var w = maxx - minx, h = maxy - miny;
			if (w < 12 || h < 8) { return; }                 /* 太远就不画，免得糊成一片 */
			/* 小样地（综合林/落叶松/油松/白桦林）统一用同一个字号 —— 综合林地更大，
			   按比例算会明显比另外两个大，金总要求"一样大"。 */
			var spanPx = Math.max(w, h);
			var small = spanPx < 260;
			var sc2 = 1;
			var fs;
			if (small) {
				fs = 24;                                    /* 小样地：固定字号，三个一样大 */
			} else {
				fs = Math.min(w / Math.max(3, name.length * 0.95), h * 0.62);
				fs = Math.max(11, Math.min(110, fs)) * 0.5;   /* 大样地字太大，缩到一半 */
			}
			dctx.save();
			dctx.globalAlpha = 0.46;                 /* 原来 0.20 太透，看不清 */
			dctx.font = '700 ' + fs.toFixed(0) + 'px Raleway,"Microsoft YaHei",sans-serif';
			dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
			dctx.lineWidth = Math.max(1.4, fs * 0.035);
			dctx.strokeStyle = '#2f7fa6';                 /* 柔和的深蓝描边，透底上够清楚又不刺眼 */
			dctx.strokeText(name, cx, cy);
			dctx.fillStyle = color;
			dctx.fillText(name, cx, cy);
			dctx.restore();
		}

		function drawBounds() {
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam || !BNDS) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			if (BND_ON) bndRings('boundaries').forEach(function (p, bi) {
					drawRing(p, V, P, '#7fc4e8', '#4a9ec4', 3.2, 0.20, true);
					var nm = (BNDS.boundaries[bi] && BNDS.boundaries[bi].name) || '';
					if (nm) { drawPlotText(p, V, P, nm + '样地', '#eaf6ff'); }
				});
			if (G20_ON) bndRings('grid20').forEach(function (p) { drawRing(p, V, P, null, 'rgba(235,235,235,.75)', 1.1, 0, true); });
			if (G40_ON) bndRings('grid40').forEach(function (p) { drawRing(p, V, P, null, 'rgba(255,210,127,.85)', 1.6, 0, true); });
			if (DRAIN_ON) (BNDS.drainage || []).forEach(function (l) { drawRing(l, V, P, null, 'rgba(72,138,178,0.85)', 1.3, 0, false); });   /* 水系：灰蓝细线，不抢视线 */
			/* 大样地 / 白桦林样地：与落叶松/油松等样地同色（金总要求统一为橙） */
			if (BIG_ON && SITE3) {
				SITE3.areas.forEach(function (a) {
					drawRing(a.ring, V, P, '#7fc4e8', '#4a9ec4', 3.2, 0.20, true);
					drawPlotText(a.ring, V, P, a.nameZh, '#eaf6ff');
				});
			}
			/* 生活区 / 林场：只留标签，不画点（金总要求） */
			/* 监测设施点：温室气体=五角星(绿)、土壤呼吸=三角形(淡蓝) —— 与微气候同大小，形状区分 */
			if (FAC_ON && FAC3) {
				FAC3.forEach(function (p) {
					var s2 = projXYZ(V, P, p.E, p.N, p.Z);
					if (s2) { drawPin(s2[0], s2[1], p.col || '#bed2ff'); drawShape(s2[0], s2[1], p.shape || 'triangle', p.col || '#bed2ff'); }
				});
			}
			/* 微气候观测点：青色菱形（高程按地形取，见 ensureMicroZ） */
			if (MICRO_ON && MICRO3) {
				MICRO3.forEach(function (p) {
					var s = projXYZ(V, P, p.E, p.N, p.Z);
					if (s) { drawPin(s[0], s[1], p.col || '#00d1d1'); drawShape(s[0], s[1], 'diamond', p.col || '#00d1d1'); }
				});
			}
			/* 其他台站（小五台 / 驼梁）的样方框：切过去才画 */
			if (STA_ACTIVE && STA_RING[STA_ACTIVE]) {				var col = (typeof STATIONS !== 'undefined' && STATIONS[STA_ACTIVE]) ? STATIONS[STA_ACTIVE].color : '#00aaff';
				STA_RING[STA_ACTIVE].forEach(function (a) {
					drawRing(a.ring.concat([a.ring[0]]), V, P, col, col, 2.6, 0.16, true);
				});
			}
		}

		/* 格网编号：每个格子取几何中心，找最近的 RTK 实测主树（VIT16/T189…），
		 * 在中心画半透明名字。20m/40m 各自跟自己的开关走。 */
		function nearestVIT(E, N) {
			var best = '', bd = Infinity;
			for (var i = 0; i < MAINT.length; i++) {
				var dx = MAINT[i].E - E, dy = MAINT[i].N - N, d2 = dx * dx + dy * dy;
				if (d2 < bd) { bd = d2; best = MAINT[i].name; }
			}
			return best;
		}
		/* 格网编号：每棵树名只写进离它最近的那个格子（一个格只写一个），没分到的空着。 */
		var CELLTXT = null;
		function buildCellText() {
			if (CELLTXT || !BNDS) return;
			CELLTXT = {};
			['grid20', 'grid40'].forEach(function (key) {
				var cells = (BNDS[key] || []).map(function (g) {
					var r = g.pts, n = r.length - 1, ax = 0, ay = 0;
					for (var i = 0; i < n; i++) { ax += r[i][0]; ay += r[i][1]; }
					return { g: g, E: ax / n, N: ay / n };
				});
				var take = {};
				MAINT.forEach(function (mt) {
					var bi = -1, bd = Infinity;
					for (var i = 0; i < cells.length; i++) {
						var d2 = (cells[i].E - mt.E) * (cells[i].E - mt.E) + (cells[i].N - mt.N) * (cells[i].N - mt.N);
						if (d2 < bd) { bd = d2; bi = i; }
					}
					if (bi < 0) { return; }
					if (!take[bi] || bd < take[bi].d2) { take[bi] = { name: mt.name, d2: bd }; }
				});
				CELLTXT[key] = { cells: cells, take: take };
			});
		}
		function drawCells() {
			if (!NUM_ON || !BNDS) return;
			buildCellText();
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			var W = innerWidth, H = innerHeight;
			dctx.font = '11px system-ui,"Segoe UI",sans-serif';
			dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
			dctx.fillStyle = 'rgba(255,255,255,.42)';
			function one(key) {
				var d = CELLTXT[key];
				if (!d) { return; }
				Object.keys(d.take).forEach(function (k) {
					var c = d.cells[k];
					var r = c.g.pts, n = r.length - 1, az = 0;      // 首尾重合，去掉最后一个
					for (var i = 0; i < n; i++) { az += r[i][2]; }
					az /= n;
					var clip = m4apply(P, m4apply(V, [c.E, c.N, az + 1.5, 1]));
					if (clip[3] <= 0) { return; }
					var sx = (clip[0] / clip[3] * 0.5 + 0.5) * W, sy = (-clip[1] / clip[3] * 0.5 + 0.5) * H;
					if (sx < -40 || sx > W + 40 || sy < -20 || sy > H + 20) { return; }
					dctx.fillText(d.take[k].name, sx, sy);
				});
			}
			/* 只勾「格网编号（VIT/T）」也要能看到编号 ——
			   原来必须同时勾 20/40 m 网格才会画，等于点了没反应（金总发现编号"不见了"）。
			   优先跟显示的网格走；两个网格都没开时，默认画 20 m 那套编号。 */
			if (G20_ON) { one('grid20'); }
			else if (G40_ON) { one('grid40'); }
			else { one('grid20'); }
		}

		// 悬停实测点显示名称
		document.getElementById('potree_render_area').addEventListener('mousemove', function (ev) {
			var best = null, bd = 144;   // 12px 内
			for (var i = 0; i < DOTSCREEN.length; i++) {
				var s = DOTSCREEN[i];
				var dd = (s.x - ev.clientX) * (s.x - ev.clientX) + (s.y - ev.clientY) * (s.y - ev.clientY);
				if (dd < bd) { bd = dd; best = s; }
			}
			if (best) {

				canvasEl2.style.cursor = (best.tree || best.kind === 'det') ? 'pointer' : '';
				if (best.kind === 'det') {

						(LANG === 'zh' ? '单木识别' : 'Detected tree') +
						'<br><span style="opacity:.8">' + (LANG === 'zh' ? '点击查看该树种' : 'Click to see this species') + '</span>';
				} else if (best.kind && best.kind.indexOf('dev-') === 0) {
					var dn = best.kind === 'dev-sap' ? (LANG === 'zh' ? '液流' : 'Sap flow')
					       : (best.kind === 'dev-den' ? (LANG === 'zh' ? '径向生长仪' : 'Dendrometer')
					       : 'LAI');
					tip.innerHTML = '<b>' + best.name + '</b><br>' + dn +
						(best.tree ? '<br><span style="opacity:.8">' + (LANG === 'zh' ? '点击查看该树数据' : 'Click for tree data') + '</span>' : '');
				} else {
					tip.innerHTML = '<b>' + best.name + '</b><br>' +
						(best.kind === 'main' ? (LANG === 'zh' ? '实测主树 (RTK)' : 'Surveyed main tree (RTK)')
						                      : (LANG === 'zh' ? '样方内树 (RTK)' : 'Quadrat tree (RTK)'));
				}
				tip.style.display = 'block';
				tip.style.left = Math.min(ev.clientX + 12, innerWidth - 250) + 'px';
				tip.style.top = (ev.clientY + 12) + 'px';
			} else { hideTip(); canvasEl2.style.cursor = ''; }
		});

		/* 点单木（单木识别树冠）→ 弹出该树种的旋转动图。
		   动图放在 3d/trees/，只有部分树种有；没有的就只报名字并说明。

		var TREE_GIF = {

		/* 每张动图里「树」的包围盒 [x, y, w, h]，画幅统一 1138x640。

		var TREE_BOX = {

			luoyesong: [463, 11, 212, 610], wujiaofeng: [359, 11, 420, 554],

		var TC = null;
		function treeCard() {

		function hideTreeCard() {

		/* ---------------- 鼠标处的三维坐标 ----------------
		 * 从相机往鼠标方向打一条射线，沿射线找与地表（window.groundZ）的交点。
		 * 没有全局 THREE，就用相机矩阵的基向量自己算方向，再二分收敛。 */
		function pickGround(cx2, cy2) {
			var cam = viewer.scene.getActiveCamera();
			if (!cam || !window.groundZ) { return null; }
			var me = cam.matrixWorld.elements;
			var px = me[12], py = me[13], pz = me[14];
			var rx = me[0], ry = me[1], rz = me[2];                 /* 右 */
			var ux = me[4], uy = me[5], uz = me[6];                 /* 上 */
			var fx = -me[8], fy = -me[9], fz = -me[10];             /* 前（相机看向 -Z） */
			var ndcX = (cx2 / innerWidth) * 2 - 1, ndcY = 1 - (cy2 / innerHeight) * 2;
			var th = Math.tan((cam.fov || 60) * Math.PI / 360), asp = innerWidth / innerHeight;
			var dx = fx + rx * ndcX * th * asp + ux * ndcY * th;
			var dy = fy + ry * ndcX * th * asp + uy * ndcY * th;
			var dz = fz + rz * ndcX * th * asp + uz * ndcY * th;
			var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
			dx /= dl; dy /= dl; dz /= dl;
			function at(t) {
				var x = px + dx * t, y = py + dy * t, z = pz + dz * t;
				var g = window.groundZ(x, y);
				return { x: x, y: y, z: z, g: isFinite(g) ? g : null };
			}
			/* 先粗扫找穿越点（相机在地面之上，往下打一定会穿过） */
			var prev = null, hit = null, t;
			for (t = 1; t < 20000; t *= 1.06) {
				var cur = at(t);
				if (cur.g == null) { prev = cur; continue; }
				if (cur.z <= cur.g) { hit = [prev || cur, cur]; break; }
				prev = cur;
			}
			if (!hit) { return null; }
			/* 二分细化 */
			var a = hit[0], b = hit[1];
			for (var k = 0; k < 18; k++) {
				var m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 };
				var g = window.groundZ(m.x, m.y);
				if (isFinite(g) && m.z > g) { a = m; } else { b = m; }
			}

		}

		(function loop() {

			if (CAM.on) camStep(now);
			flyStep(now);
			recStep(now);
			ensureGround(); project(); drawDots(); ensureSiteZ(); ensureMicroZ(); ensureFacZ(); drawBounds(); drawCells();
			requestAnimationFrame(loop);
		})();
	</script>
	<style>
		.lg3d b { display:inline-block; background:#c2703d; color:#fff; font-size:9px; font-weight:700;
			padding:0 3px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.6); }

		/* 窄屏修正（必须放在基础规则之后，否则被 .layers-panel / #legend3d 的原规则盖掉）
		 * 实测：顶栏一换行 .layers 就落到左边，面板锚右 → 整块被挤出屏幕外，
		 * 手机上只剩 10px 白边、图层根本点不到。 */
		@media (max-width: 900px) {
			/* 900 以下镜头条会顶到右下角图例（768 宽实测压住 63x10px），把图例抬起来 */
			#legend3d { bottom: 66px; }
		}
		@media (max-width: 640px) {
			/* 面板已固定在视口右上角，不再需要往左挪；只收窄高度 */
			.layers-panel { max-height: calc(100vh - 220px); }
			.layers-panel label { padding: 7px 4px; }      /* 手机上手指要够大 */
			/* 手机上底部被镜头条+图例占满，提示条会压在图上；而且「右键拖动」对触屏也不适用 */
			#ctrlHint { display: none; }
		}
		/* 更窄的屏：图例限宽，别钻到左边面板底下（面板 z-index 更高，会把它左半边盖住） */
		@media (max-width: 430px) {
			#legend3d { max-width: 40vw; }
		}
			/* 单木卡片里的冠层 P 反演小曲线 */
		#treeCard .tc-spark { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(160, 180, 120, .22); }
		#treeCard .tc-spark canvas { display: block; width: 100%; height: auto; }
		#treeCard .tc-spark .cap { margin-top: 6px; font-size: 12px; color: #9fb08a;
			font-variant-numeric: tabular-nums; }
		#treeCard .tc-spark .cap b { color: #cfe3b0; }
		/* —— 覆盖：树图必须白底（前面有重复定义，旧的会把白底盖掉） —— */
		#treeCard .tc-imgwrap { background: #ffffff !important;
			box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1) !important; }
		#treeCard .tc-spark { display: block !important; }
</style>
