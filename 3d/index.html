<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>北京森林站 · 三维林相</title>

	<link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
	<link rel="stylesheet" type="text/css" href="../css/leaflet.css">

	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #14170f;
			font-family: Raleway, "Segoe UI", "Microsoft YaHei", sans-serif; }
		#potree_render_area { background: radial-gradient(circle at 50% 40%, #232a1c 0%, #12150e 70%, #0b0d08 100%); }

		/* 顶部标题栏 */
		#topbar {
			position: fixed; left: 0; right: 0; top: 0; z-index: 2000;
			display: flex; align-items: center; gap: 14px;
			padding: 10px 16px; pointer-events: none;
			background: linear-gradient(180deg, rgba(10,13,8,.82), rgba(10,13,8,0));
		}
		#topbar .brand { color: #d7d2c6; font-size: 15px; font-weight: 700; letter-spacing: .3px;
			text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: auto; }
		#topbar .brand small { display:block; font-weight: 400; opacity: .72; font-size: 11px; letter-spacing: 0; }
		#topbar .spacer { flex: 1; }
		#topbar a.btn, #topbar button.btn {
			pointer-events: auto; cursor: pointer; text-decoration: none;
			color: #e7e3d8; background: rgba(38,42,30,.72); border: 1px solid rgba(160,180,120,.35);
			border-radius: 6px; padding: 7px 13px; font-size: 13px; font-family: inherit;
		}
		#topbar a.btn:hover, #topbar button.btn:hover { background: rgba(58,72,40,.85); color: #fff; }
		@media (max-width: 640px) {
			#topbar { flex-wrap: wrap; row-gap: 6px; padding: 8px 10px; }
			#topbar .spacer { display: none; }
			#topbar .brand { flex-basis: 100%; font-size: 13px; }
			#topbar .brand small { display: none; }
			#potree_sidebar_container { top: 84px !important; }
		}

		/* 自动镜头按钮条（底部中央） */
		#camBar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 1950;
			display: flex; gap: 6px; padding: 6px 8px; border-radius: 20px; max-width: 94vw;
			background: rgba(20, 24, 15, .82); border: 1px solid rgba(160, 180, 120, .3);
			box-shadow: 0 6px 20px rgba(0,0,0,.5); overflow-x: auto; }
		#camBar .cbtn { flex: none; padding: 6px 12px; border-radius: 14px; cursor: pointer;
			font-size: 12.5px; font-family: inherit; color: #d7d2c6;
			background: rgba(58, 72, 40, .5); border: 1px solid rgba(160, 180, 120, .35); }
		#camBar .cbtn:hover { background: rgba(88, 110, 62, .8); color: #fff; }
		#camBar .cbtn.active { background: #6ca14a; color: #14170f; border-color: #9ed06a; font-weight: 700; }
		#camBar .cbtn.stop { background: rgba(90, 55, 45, .6); border-color: rgba(190, 120, 100, .4); }
		@media (max-width: 640px) { #camBar .cbtn { padding: 5px 9px; font-size: 11.5px; } }

		/* 拟真 3D 指南针（左侧中部，跟相机方位同步） */
		#compass3d { position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
			z-index: 1900; pointer-events: none; width: 170px; height: 170px; }
		@media (max-width: 640px) {
			#compass3d { width: 108px; height: 108px; left: 8px; top: 40%; }
		}

		/* 台站切换按钮（左上，标题栏下面） */
		#staBar { position: fixed; left: 12px; top: 78px; z-index: 1900; display: flex; gap: 6px; }
		#staBar .sbtn { font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 4px; cursor: pointer;
			color: #d7d2c6; background: rgba(20, 24, 15, .82); border: 1px solid rgba(160, 180, 120, .3); }
		#staBar .sbtn:hover { background: rgba(88, 110, 62, .85); color: #fff; }
		#staBar .sbtn.on { background: #6ca14a; color: #14170f; font-weight: 700; border-color: #9ed06a; }
		@media (max-width: 640px) {
			#staBar { top: auto; bottom: 96px; left: 8px; gap: 4px; }
			#staBar .sbtn { padding: 6px 9px; font-size: 12px; }
		}

		/* 加载进度框 */
		#loading { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 3000;
			background: rgba(16, 20, 12, .88); border: 1px solid rgba(160, 180, 120, .35);
			border-radius: 10px; padding: 22px 30px 18px; min-width: 230px; text-align: center;
			color: #d7d2c6; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
		#loading.done { opacity: 0; transition: opacity .5s; pointer-events: none; }
		#loading .spin { width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%;
			border: 3px solid rgba(210, 225, 180, .25); border-top-color: #8fbf63;
			animation: lspin .9s linear infinite; }
		@keyframes lspin { to { transform: rotate(360deg); } }
		#loading .ltxt { font-size: 14px; margin-bottom: 10px; }
		#loading .lbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
		#loading .lbar i { display: block; height: 100%; width: 0; border-radius: 3px;
			background: linear-gradient(90deg, #6ca14a, #9ed06a); transition: width .3s; }
		#loading .lsub { font-size: 11.5px; opacity: .75; margin-top: 7px; }

		/* 右上角图层控件（常开，白底可选面板，同 2D 地图） */
		.layers { position: relative; pointer-events: auto; }
		.layers-panel { position: absolute; right: 0; top: 4px; z-index: 2100;
			background: #fff; color: #333; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.4);
			padding: 10px 14px 8px; min-width: 170px;
			max-height: calc(100vh - 132px); overflow-y: auto; }   /* 开关多了：矮窗口里滚动，别顶出屏 */
		.layers-panel .lp-cap { font-size: 12px; font-weight: 700; color: #666;
			letter-spacing: .5px; margin: 0 0 4px; }
		.lbtn { display: none; }   /* 桌面：面板常开，用不到折叠按钮 */
		.layers-panel label { display: block; padding: 5px 4px; font-size: 14px; cursor: pointer;   /* 5px：14 行时别顶到右下角图例 */
			user-select: none; white-space: nowrap; border-radius: 4px; }
		.layers-panel label:hover { background: rgba(108,161,74,.14); }
		.layers-panel input { margin-right: 7px; vertical-align: middle; width: 15px; height: 15px;
			accent-color: #2f6fdb; cursor: pointer; }

		/* 三维场景里的浮动标签 */
		#labels { position: fixed; inset: 0; z-index: 1500; pointer-events: none; overflow: hidden; }
		.lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
			white-space: nowrap; font-size: 11px; color: #fff; padding: 2px 6px; border-radius: 10px;
			background: rgba(28,33,22,.78); border: 1px solid rgba(160,180,120,.5);
			box-shadow: 0 1px 4px rgba(0,0,0,.5); }
		.lbl.tree { background: rgba(40,74,40,.86); }
		.lbl.log { background: rgba(122,66,28,.9); font-weight: 700; }
		.lbl:hover { background: #6ca14a; border-color: #fff; }
		.lbl.hidden { display: none; }
		#tip { position: fixed; z-index: 1600; pointer-events: none; max-width: 240px; display: none;
			background: rgba(20,24,15,.95); color: #ddd7cd; border: 1px solid rgba(160,180,120,.4);
			border-radius: 6px; padding: 7px 10px; font-size: 12px; line-height: 1.5; }

		/* 实测点（主树/样方内树）画布圆点 */
		#dots { position: fixed; inset: 0; z-index: 1400; pointer-events: none; }

		/* 图例 */
		#legend3d { position: fixed; right: 12px; bottom: 12px; z-index: 1900;
			background: rgba(20,24,15,.82); border: 1px solid rgba(160,180,120,.3);
			border-radius: 6px; padding: 8px 11px; font-size: 11.5px; color: #d3cec1; line-height: 1.75;
			max-height: calc(100vh - 556px); overflow-y: auto; }   /* 别长过头顶到右上角图层面板（含内边距，800 高窗口实测会撞） */
		#legend3d i { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
			margin-right: 6px; vertical-align: middle; }
		#legend3d i.mon  { background: #6ca14a; }
		#legend3d i.log  { background: #c2703d; }
		#legend3d i.main { background: #8fb4d6; }
		#legend3d i.tree { background: #d3a970; }
		#legend3d i.det  { background: linear-gradient(90deg,#4f7a52,#b3903a,#c06a3c); }
		#legend3d .sl3d { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(160,180,120,.3); max-width: 210px; }
		/* 设备图例：立体样式（短竖杆 + 形状），对应场景里那三根杆子 */
		#legend3d .dev-legend { margin-top: 6px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 6px; }
		#legend3d .dv { display: inline-flex; align-items: flex-end; margin: 0 10px 4px 0; font-size: 11.5px;
			color: #cfd4c4; }
		#legend3d .dv .stem { width: 2px; height: 12px; display: inline-block; margin-right: 3px; opacity: .8; }
		#legend3d .dv .sh { display: inline-block; width: 9px; height: 9px; margin: 0 4px 2px -9px; }
		#legend3d .dv .sh.c { border-radius: 50%; }
		#legend3d .dv .sh.t { width: 0; height: 0; background: none !important;
			border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 9px solid; }
		#legend3d .sl3d-i { display: inline-block; margin: 0 8px 2px 0; }
		#legend3d .sl3d-i i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
			margin-right: 4px; vertical-align: middle; }
		/* 树种数量柱状图 */
		#legend3d .bars { margin-top: 4px; }
		#legend3d .bar-row { display: flex; align-items: center; margin: 2px 0; font-size: 11.5px; }
		#legend3d .bar-name { width: 52px; flex: none; text-align: right; padding-right: 7px;
			color: #cfd4c4; white-space: nowrap; }
		#legend3d .bar-track { flex: 1; height: 11px; background: rgba(255,255,255,.07);
			border-radius: 3px; overflow: hidden; }
		#legend3d .bar { display: block; height: 100%; border-radius: 3px 2px 2px 3px; }
		#legend3d .bar-n { width: 36px; flex: none; text-align: left; padding-left: 6px;
			color: #aeb59f; font-size: 10.5px; }
		@media (max-width: 640px) { #legend3d { font-size: 10.5px; padding: 6px 8px; } }

		/* 操作提示（相机只有环绕一种模式：左键旋转 · 中键平移 · 滚轮缩放） */
		#ctrlHint { position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); z-index: 1900;
			background: rgba(20,24,15,.72); color: #d7d2c6; pointer-events: none;
			border: 1px solid rgba(160,180,120,.28); border-radius: 6px; padding: 6px 13px; font-size: 12.5px; }
		@media (max-width: 640px) { #ctrlHint { font-size: 11px; padding: 5px 10px; bottom: 58px; } }   /* 原来是 10px，正压在镜头条上 */

		.potree_container { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
		/* 把 Potree 的菜单按钮下移，避免和顶部标题重叠 */
		#potree_sidebar_container { top: 46px !important; display: none !important; }
		#potree_menu_button { display: none !important; }   /* 左上角 Potree 自带的小按钮，金总看不懂 */
		#potree_map_toggle { display: none !important; }    /* 左上角那个小地图缩略图开关，同上 */
		#potree_quick_buttons { display: none !important; }
	</style>
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>
	<script src="../js/leaflet.js"></script>
	<script src="../js/devices.js"></script>
<script src="../js/stations.js"></script>	<!-- 小五台 / 驼梁样地（与二维同一份） -->

	<div id="topbar">
		<div class="brand"><span id="bt">北京森林生态系统定位研究站 · 三维林相</span>
			<small id="bs">无人机 LiDAR 彩色点云 · 高德卫星底图 · 20 棵监测树 / 3 台数采</small></div>
		<div class="spacer"></div>
		<div class="layers" id="layersBox">
			<!-- 窄屏折叠按钮：桌面端隐藏（面板常开），手机上跟二维地图一样默认收起来 -->
			<button class="btn lbtn" id="layersBtn" aria-expanded="false">图层</button>
			<div class="layers-panel open" id="layersPanel">
				<div class="lp-cap" id="lblLayers">图层</div>
				<label><input type="checkbox" id="chkPC" checked> <span id="lblPC">点云</span></label>
				<label><input type="checkbox" id="chkDet" checked> <span id="lblDet">单木覆盖</span></label>
				<label><input type="checkbox" id="chkBnd" checked> <span id="lblBnd">样地边界</span></label>
				<label><input type="checkbox" id="chkBig" checked> <span id="lblBig">大样地·白桦林</span></label>
				<label><input type="checkbox" id="chkSite" checked> <span id="lblSite">生活区·林场</span></label>
				<label><input type="checkbox" id="chkMicro" checked> <span id="lblMicro">微气候点</span></label>
				<label><input type="checkbox" id="chkFac" checked> <span id="lblFac">土壤温室气体·呼吸</span></label>
				<label><input type="checkbox" id="chkName" checked> <span id="lblName">名称标注</span></label>
				<label><input type="checkbox" id="chkP"> <span id="lblP">冠层 P</span></label>
				<label id="pRow" style="display:none"><select id="pDate"></select> <span id="pRange"></span></label>
				<label><input type="checkbox" id="chkG20"> <span id="lblG20">20 m 网格</span></label>
				<label><input type="checkbox" id="chkG40"> <span id="lblG40">40 m 网格</span></label>
				<label><input type="checkbox" id="chkDrain"> <span id="lblDrain">水系</span></label>
				<label><input type="checkbox" id="chkNum"> <span id="lblNum">格网编号（VIT/T）</span></label>
				<label><input type="checkbox" id="chkSap"> <span id="lblSap">液流</span></label>
				<label><input type="checkbox" id="chkDen"> <span id="lblDen">径向生长</span></label>
				<label><input type="checkbox" id="chkLai"> <span id="lblLai">LAI</span></label>
				<label><input type="checkbox" id="chkGround" checked> <span id="lblGround">影像地面</span></label>
			</div>
		</div>
		<button class="btn" id="langBtn">EN</button>
		<a class="btn" href="../index.html" id="backBtn">← 返回网站</a>
	</div>
	<div id="ctrlHint"></div>

	<!-- 台站切换：与二维地图同一套（东灵山本站 / 小五台 / 驼梁）。切到别的站会现建一块
	     4 km 见方的局部地形（terrarium 高程 + 天地图影像），并画上该站的样方框。 -->
	<div id="staBar"></div>

	<!-- 拟真 3D 指南针：倾斜表盘 + 金属外圈 + 红北针，跟相机方位实时同步 -->
	<canvas id="compass3d" width="170" height="170" title="指北"></canvas>

	<!-- 自动镜头：懒得自己操作就按一个，画面自己动（再点同键 / 用户一动手 = 停） -->
	<div id="camBar">
		<button class="cbtn" data-cam="orbit" id="camOrbit">环绕</button>
		<button class="cbtn" data-cam="flyover" id="camFly">低空巡航</button>
		<button class="cbtn" data-cam="dolly" id="camDolly">推拉</button>
		<button class="cbtn" data-cam="rise" id="camRise">升空俯瞰</button>
		<button class="cbtn" id="camSpeed">速度 1×</button>
		<button class="cbtn active" id="camLoop">循环</button>
		<button class="cbtn stop" id="camStop" title="停止">■ 停</button>
	</div>

	<!-- 加载进度：点云 9 块 + 首屏渲染，慢的时候让用户知道在动 -->
	<div id="loading">
		<div class="spin"></div>
		<div class="ltxt" id="loadTxt">正在加载三维点云…</div>
		<div class="lbar"><i id="loadBar"></i></div>
		<div class="lsub" id="loadSub">0 / 9</div>
	</div>

	<div id="labels"></div>
	<div id="tip"></div>
	<canvas id="dots"></canvas>
	<div id="legend3d"></div>

	<div class="potree_container">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script>
		var I18N = {
			zh: { title: '北京森林生态系统定位研究站 · 三维林相',
			      sub: '无人机 LiDAR 彩色点云 · 高德卫星底图 · 20 棵监测树 / 3 台数采',
			      back: '← 返回网站', lang: 'EN',
			      layers: '图层', lLayers: '图层', lDet: '单木覆盖', lBnd: '样地边界',
			      lPC: '点云', lBig: '大样地·白桦林', lSite: '生活区·林场', lName: '名称标注',
			      lMicro: '微气候点', lFac: '土壤温室气体·呼吸',
			      lP: '冠层 P',
			      lG20: '20 m 网格', lG40: '40 m 网格', lDrain: '水系', lNum: '格网编号（VIT/T）',
			      lSap: '液流', lDen: '径向生长', lLai: 'LAI',
			      camOrbit: '环绕', camFly: '低空巡航', camDolly: '推拉', camRise: '升空俯瞰', camStop: '■ 停',
			      camSpeed: '速度', camLoop: '循环', lGround: '影像地面',
			      ctrlHint: '左键拖动旋转 · 中键拖动平移 · 滚轮缩放',
			      staDl: '东灵山（本站）',
			      loadCloud: '正在加载三维点云…', loadRender: '正在渲染首屏…' },
			en: { title: 'Beijing Forest Ecosystem Research Station · 3D Canopy',
			      sub: 'UAV LiDAR colour point cloud · AMap satellite · 20 monitored trees / 3 loggers',
			      back: '← Back to site', lang: '中文',
			      layers: 'Layers', lLayers: 'Layers', lDet: 'Tree cover', lBnd: 'Plot boundaries',
			      lPC: 'Point cloud', lBig: '20 ha / birch plots', lSite: 'Station · forestry farm', lName: 'Labels',
			      lMicro: 'Microclimate', lFac: 'Soil GHG · respiration',
			      lP: 'Canopy P',
			      lG20: '20 m grid', lG40: '40 m grid', lDrain: 'Drainage', lNum: 'Grid IDs (VIT/T)',
			      lSap: 'Sap flow', lDen: 'Dendrometer', lLai: 'LAI',
			      camOrbit: 'Orbit', camFly: 'Low flyover', camDolly: 'Dolly', camRise: 'Rise & overlook', camStop: '■ Stop',
			      camSpeed: 'Speed', camLoop: 'Loop', lGround: 'Imagery ground',
			      ctrlHint: 'Drag to rotate · Middle-drag to pan · Scroll to zoom',
			      staDl: 'Mt. Dongling (main)',
			      loadCloud: 'Loading 3D point cloud…', loadRender: 'Rendering first view…' }
		};
		var LANG = localStorage.getItem('bfers-3d-lang') || 'zh';
		function applyLang() {
			var d = I18N[LANG];
			document.documentElement.lang = LANG;
			document.getElementById('bt').textContent = d.title;
			document.getElementById('bs').textContent = d.sub;
			document.getElementById('backBtn').textContent = d.back;
			document.getElementById('langBtn').textContent = d.lang;
			var ch = document.getElementById('ctrlHint');
			if (ch) ch.textContent = d.ctrlHint;
			var lb = document.getElementById('lblLayers'); if (lb) lb.textContent = d.lLayers;
			var bl = document.getElementById('layersBtn'); if (bl) bl.textContent = d.lLayers;
			lb = document.getElementById('lblDet'); if (lb) lb.textContent = d.lDet;
			lb = document.getElementById('lblBnd'); if (lb) lb.textContent = d.lBnd;
			lb = document.getElementById('lblPC'); if (lb) lb.textContent = d.lPC;
			lb = document.getElementById('lblBig'); if (lb) lb.textContent = d.lBig;
			lb = document.getElementById('lblSite'); if (lb) lb.textContent = d.lSite;
			lb = document.getElementById('lblName'); if (lb) lb.textContent = d.lName;

					if (top[3] > 0) {
						var tx = (top[0] / top[3] * 0.5 + 0.5) * W, ty = (-top[1] / top[3] * 0.5 + 0.5) * H;
						dctx.strokeStyle = dc; dctx.globalAlpha = 0.85; dctx.lineWidth = 1.6;
						dctx.beginPath(); dctx.moveTo(sx, sy); dctx.lineTo(tx, ty); dctx.stroke();
						dctx.globalAlpha = 1;
						sx = tx; sy = ty;
					}
					var rr = d2 > 400 * 400 ? 3.2 : (d2 > 150 * 150 ? 4.2 : 5.6);
					dctx.fillStyle = dc;
					dctx.strokeStyle = 'rgba(10,13,8,.85)';
					dctx.lineWidth = 1.4;
					dctx.beginPath();
					if (p.kind === 'dev-sap') {                       /* 液流：圆 */
						dctx.arc(sx, sy, rr, 0, 6.2832);
					} else if (p.kind === 'dev-den') {                /* 径向生长：方 */
						dctx.rect(sx - rr, sy - rr, rr * 2, rr * 2);
					} else {                                          /* LAI：三角 */
						dctx.moveTo(sx, sy - rr);
						dctx.lineTo(sx + rr, sy + rr * 0.85);
						dctx.lineTo(sx - rr, sy + rr * 0.85);
						dctx.closePath();
					}
					dctx.fill(); dctx.stroke();
					DOTSCREEN.push({ x: sx, y: sy, name: p.name, kind: p.kind, tree: TREE_IDS[p.name] ? p.name : null });
					if (d2 < LABEL_DIST * LABEL_DIST) texts.push({ sx: sx, sy: sy, d2: d2, name: p.name });
					continue;
				} else {
					var r = d2 > 400 * 400 ? 1.7 : (d2 > 150 * 150 ? 2.2 : 3.2);
					dctx.globalAlpha = 0.9;
					dctx.fillStyle = '#d3a970';
					dctx.beginPath(); dctx.arc(sx, sy, r, 0, 6.2832); dctx.fill();
					dctx.lineWidth = 1; dctx.strokeStyle = 'rgba(10,13,8,.9)'; dctx.stroke();
					dctx.globalAlpha = 1;
				}
				DOTSCREEN.push({ x: sx, y: sy, name: p.name, kind: p.kind });
				if (d2 < LABEL_DIST * LABEL_DIST) texts.push({ sx: sx, sy: sy, d2: d2, name: p.name });
			}

			// 放大后显示名称（近的优先，重叠的跳过）
			if (texts.length) {
				texts.sort(function (a, b) { return a.d2 - b.d2; });
				dctx.font = '12px Raleway,"Microsoft YaHei",sans-serif';
				dctx.textAlign = 'left'; dctx.textBaseline = 'middle';
				var placed = [];
				for (var k = 0; k < texts.length; k++) {
					var t = texts[k], w = dctx.measureText(t.name).width + 8, h = 15;
					var x = t.sx + 7, y = t.sy;
					var ok = true;
					for (var j = 0; j < placed.length; j++) {
						if (Math.abs(x - placed[j].x) < (w + placed[j].w) / 2 &&
							Math.abs(y - placed[j].y) < (h + placed[j].h) / 2) { ok = false; break; }
					}
					if (!ok) continue;
					dctx.fillStyle = 'rgba(20,24,15,.78)';
					dctx.fillRect(x - 4, y - h / 2, w, h);
					dctx.fillStyle = '#e7e3d8';
					dctx.fillText(t.name, x, y);
					placed.push({ x: x, y: y, w: w, h: h });
				}
			}
		}

		// --- 样地边界 / 网格 / 水系（画在地面上，见 3d/bounds.json） ---
		function projXYZ(V, P, x, y, z) {
			var clip = m4apply(P, m4apply(V, [x, y, z, 1]));
			if (clip[3] <= 0.0001) return null;
			return [(clip[0] / clip[3] * 0.5 + 0.5) * innerWidth,
			        (-clip[1] / clip[3] * 0.5 + 0.5) * innerHeight];
		}
		function drawCrown(ring, V, P, color) {
			if (!ring || ring.length < 3) return;
			dctx.beginPath();
			for (var i = 0; i < ring.length; i++) {
				var s = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!s) return;
				if (i === 0) dctx.moveTo(s[0], s[1]); else dctx.lineTo(s[0], s[1]);
			}
			dctx.closePath();
			dctx.globalAlpha = 0.45; dctx.fillStyle = color; dctx.fill();
			dctx.globalAlpha = 0.9; dctx.strokeStyle = color; dctx.lineWidth = 1; dctx.stroke();
			dctx.globalAlpha = 1;
		}
		function drawRing(ring, V, P, fill, stroke, lw, alpha, close) {
			if (!ring || ring.length < 2) return;
			/* 相机进到多边形里面时必然有点在相机背后。原来碰到一个就整条不画 —— 大样地 500 m 见方，
			   飞进去整圈就没了。改成只画落在身前的段，碰到背后的顶点就断开（不断线到相机后面去）。 */
			dctx.beginPath();
			var started = false, drawn = 0;
			for (var i = 0; i < ring.length; i++) {
				var s = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!s) { started = false; continue; }
				if (started) { dctx.lineTo(s[0], s[1]); } else { dctx.moveTo(s[0], s[1]); started = true; }
				drawn++;
			}
			if (!drawn) return;
			if (close) dctx.closePath();
			if (fill) { dctx.globalAlpha = alpha; dctx.fillStyle = fill; dctx.fill(); }
			if (stroke) { dctx.globalAlpha = 1; dctx.strokeStyle = stroke; dctx.lineWidth = lw; dctx.stroke(); }
			dctx.globalAlpha = 1;
		}
		/* --- 生活区 / 林场 / 大样地 / 白桦林样地（3d/sites.json） ---
		 * 这几处都在样地 DEM 覆盖之外，高程只能等地形铺好（window.groundZ）再算，
		 * 所以这里做一次性缓存，顺便把名称标签挂上。 */
		var SITE3 = null;
		function ensureSiteZ() {
			if (SITE3 || !SITES || !window.groundZ) return;
			function gz(E, N) { var z = window.groundZ(E, N); return isFinite(z) ? z + 1.0 : null; }
			function ring(list) {
				var out = [];
				for (var i = 0; i < list.length; i++) {
					var z = gz(list[i][0], list[i][1]);
					if (z == null) return null;
					out.push([list[i][0], list[i][1], z]);
				}
				return out;
			}
			var areas = [], points = [];
			(SITES.areas || []).forEach(function (a) {
				var r = ring(a.pts);
				if (r) areas.push({ id: a.id, nameZh: a.nameZh, name: a.name, ring: r });
			});
			(SITES.points || []).forEach(function (p) {
				var z = gz(p.E, p.N);
				if (z == null) return;
				points.push({ id: p.id, nameZh: p.nameZh, name: p.name, E: p.E, N: p.N, Z: z, alt: p.alt });
			});
			SITE3 = { areas: areas, points: points };

			/* 名称标签（与三个样地标签同一套样式）；文字按语言切换见 applyLang */
			areas.forEach(function (a) {
				var n = a.ring.length, ax = 0, ay = 0, az = 0;
				for (var i = 0; i < n; i++) { ax += a.ring[i][0]; ay += a.ring[i][1]; az += a.ring[i][2]; }
				var L = addLabel(ax / n, ay / n, az / n + 25, a.nameZh, 'log', null, a.name);
				L.el.addEventListener('mousemove', function (ev) {
					showTip(ev, '<b>' + L.el.textContent + '</b>');
				});
			});
			points.forEach(function (p) {
				var L = addLabel(p.E, p.N, p.Z + 25, p.nameZh, 'log', null, p.name);
				L.el.addEventListener('mousemove', function (ev) {
					showTip(ev, '<b>' + L.el.textContent + '</b>' +
						(p.alt != null ? '<br>' + p.alt + ' m' : ''));
				});
			});
		}

		function drawBounds() {
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam || !BNDS) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			if (BND_ON) {
				(BNDS.boundaries || []).forEach(function (b) {
					drawRing(b.pts, V, P, '#f98422', '#f98422', 2.5, 0.16, true);
				});
			}
			if (G20_ON) (BNDS.grid20 || []).forEach(function (g) { drawRing(g.pts, V, P, null, 'rgba(235,235,235,.75)', 1.1, 0, true); });
			if (G40_ON) (BNDS.grid40 || []).forEach(function (g) { drawRing(g.pts, V, P, null, 'rgba(255,210,127,.85)', 1.6, 0, true); });
			if (DRAIN_ON) (BNDS.drainage || []).forEach(function (l) { drawRing(l, V, P, null, 'rgba(72,138,178,0.85)', 1.3, 0, false); });   /* 水系：灰蓝细线，不抢视线 */
			/* 大样地 / 白桦林样地：蓝色描边，跟橙色三个样地区分开 */
			if (BIG_ON && SITE3) {
				SITE3.areas.forEach(function (a) { drawRing(a.ring, V, P, '#3f8fd0', '#3f8fd0', 2.4, 0.14, true); });
			}
			/* 生活区 / 林场：地面上的黄点 */
			if (SITE_ON && SITE3) {
				SITE3.points.forEach(function (p) {
					var s = projXYZ(V, P, p.E, p.N, p.Z);
					if (!s) return;
					dctx.beginPath();
					dctx.arc(s[0], s[1], 5.5, 0, Math.PI * 2);
					dctx.fillStyle = '#ffd400'; dctx.globalAlpha = 1; dctx.fill();
					dctx.lineWidth = 2; dctx.strokeStyle = '#20242a'; dctx.stroke();
				});
			}
			/* 监测设施点：五角星（温室气体=绿、土壤呼吸=淡蓝），配色沿用展板 */
			if (FAC_ON && FAC3) {
				FAC3.forEach(function (p) {
					var s2 = projXYZ(V, P, p.E, p.N, p.Z);
					if (!s2) { return; }
					var col = (p.name.indexOf('温室') >= 0) ? '#00e000' : '#bed2ff';
					dctx.save();
					dctx.translate(s2[0], s2[1]);
					dctx.beginPath();
					for (var i = 0; i < 10; i++) {
						var rr = (i % 2 === 0) ? 9 : 4, a2 = -Math.PI / 2 + i * Math.PI / 5;
						var px2 = Math.cos(a2) * rr, py2 = Math.sin(a2) * rr;
						if (i === 0) { dctx.moveTo(px2, py2); } else { dctx.lineTo(px2, py2); }
					}
					dctx.closePath();
					dctx.fillStyle = col; dctx.globalAlpha = 1; dctx.fill();
					dctx.lineWidth = 1.6; dctx.strokeStyle = '#111'; dctx.stroke();
					dctx.restore();
				});
			}
			/* 微气候观测点：青色菱形（高程按地形取，见 ensureMicroZ） */
			if (MICRO_ON && MICRO3) {
				MICRO3.forEach(function (p) {
					var s = projXYZ(V, P, p.E, p.N, p.Z);
					if (!s) { return; }
					dctx.save();
					dctx.translate(s[0], s[1]); dctx.rotate(Math.PI / 4);
					dctx.fillStyle = '#00d1d1'; dctx.strokeStyle = '#1a1a1a'; dctx.lineWidth = 1.6;
					dctx.fillRect(-4, -4, 8, 8); dctx.strokeRect(-4, -4, 8, 8);
					dctx.restore();
				});
			}
			/* 其他台站（小五台 / 驼梁）的样方框：切过去才画 */
			if (STA_ACTIVE && STA_RING[STA_ACTIVE]) {				var col = (typeof STATIONS !== 'undefined' && STATIONS[STA_ACTIVE]) ? STATIONS[STA_ACTIVE].color : '#00aaff';
				STA_RING[STA_ACTIVE].forEach(function (a) {
					drawRing(a.ring.concat([a.ring[0]]), V, P, col, col, 2.6, 0.16, true);
				});
			}
		}

		/* 格网编号：每个格子取几何中心，找最近的 RTK 实测主树（VIT16/T189…），
		 * 在中心画半透明名字。20m/40m 各自跟自己的开关走。 */
		function nearestVIT(E, N) {
			var best = '', bd = Infinity;
			for (var i = 0; i < MAINT.length; i++) {
				var dx = MAINT[i].E - E, dy = MAINT[i].N - N, d2 = dx * dx + dy * dy;
				if (d2 < bd) { bd = d2; best = MAINT[i].name; }
			}
			return best;
		}
		/* 格网编号：每棵树名只写进离它最近的那个格子（一个格只写一个），没分到的空着。 */
		var CELLTXT = null;
		function buildCellText() {
			if (CELLTXT || !BNDS) return;
			CELLTXT = {};
			['grid20', 'grid40'].forEach(function (key) {
				var cells = (BNDS[key] || []).map(function (g) {
					var r = g.pts, n = r.length - 1, ax = 0, ay = 0;
					for (var i = 0; i < n; i++) { ax += r[i][0]; ay += r[i][1]; }
					return { g: g, E: ax / n, N: ay / n };
				});
				var take = {};
				MAINT.forEach(function (mt) {
					var bi = -1, bd = Infinity;
					for (var i = 0; i < cells.length; i++) {
						var d2 = (cells[i].E - mt.E) * (cells[i].E - mt.E) + (cells[i].N - mt.N) * (cells[i].N - mt.N);
						if (d2 < bd) { bd = d2; bi = i; }
					}
					if (bi < 0) { return; }
					if (!take[bi] || bd < take[bi].d2) { take[bi] = { name: mt.name, d2: bd }; }
				});
				CELLTXT[key] = { cells: cells, take: take };
			});
		}
		function drawCells() {
			if (!NUM_ON || !BNDS) return;
			buildCellText();
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			var W = innerWidth, H = innerHeight;
			dctx.font = '11px system-ui,"Segoe UI",sans-serif';
			dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
			dctx.fillStyle = 'rgba(255,255,255,.42)';
			function one(key) {
				var d = CELLTXT[key];
				if (!d) { return; }
				Object.keys(d.take).forEach(function (k) {
					var c = d.cells[k];
					var r = c.g.pts, n = r.length - 1, az = 0;      // 首尾重合，去掉最后一个
					for (var i = 0; i < n; i++) { az += r[i][2]; }
					az /= n;
					var clip = m4apply(P, m4apply(V, [c.E, c.N, az + 1.5, 1]));
					if (clip[3] <= 0) { return; }
					var sx = (clip[0] / clip[3] * 0.5 + 0.5) * W, sy = (-clip[1] / clip[3] * 0.5 + 0.5) * H;
					if (sx < -40 || sx > W + 40 || sy < -20 || sy > H + 20) { return; }
					dctx.fillText(d.take[k].name, sx, sy);
				});
			}
			if (G20_ON) one('grid20');
			if (G40_ON) one('grid40');
		}

		// 悬停实测点显示名称
		document.getElementById('potree_render_area').addEventListener('mousemove', function (ev) {
			var best = null, bd = 144;   // 12px 内
			for (var i = 0; i < DOTSCREEN.length; i++) {
				var s = DOTSCREEN[i];
				var dd = (s.x - ev.clientX) * (s.x - ev.clientX) + (s.y - ev.clientY) * (s.y - ev.clientY);
				if (dd < bd) { bd = dd; best = s; }
			}
			if (best) {
				tip = tip || document.getElementById('tip');
				canvasEl2.style.cursor = best.tree ? 'pointer' : '';
				if (best.kind === 'det') {
					tip.innerHTML = '<b>' + ((SPECIES[best.sp] && SPECIES[best.sp].zh) || '') + '</b><br>' +
						(LANG === 'zh' ? '单木识别' : 'Detected tree');
				} else if (best.kind && best.kind.indexOf('dev-') === 0) {
					var dn = best.kind === 'dev-sap' ? (LANG === 'zh' ? '液流' : 'Sap flow')
					       : (best.kind === 'dev-den' ? (LANG === 'zh' ? '径向生长仪' : 'Dendrometer')
					       : 'LAI');
					tip.innerHTML = '<b>' + best.name + '</b><br>' + dn +
						(best.tree ? '<br><span style="opacity:.8">' + (LANG === 'zh' ? '点击查看该树数据' : 'Click for tree data') + '</span>' : '');
				} else {
					tip.innerHTML = '<b>' + best.name + '</b><br>' +
						(best.kind === 'main' ? (LANG === 'zh' ? '实测主树 (RTK)' : 'Surveyed main tree (RTK)')
						                      : (LANG === 'zh' ? '样方内树 (RTK)' : 'Quadrat tree (RTK)'));
				}
				tip.style.display = 'block';
				tip.style.left = Math.min(ev.clientX + 12, innerWidth - 250) + 'px';
				tip.style.top = (ev.clientY + 12) + 'px';
			} else { hideTip(); canvasEl2.style.cursor = ''; }
		});

		/* 点击液流点（名字即监测树号）→ 跳到主页该树的数据。
		   内嵌在主页 iframe 里就 postMessage 通知父页；独立打开就带 ?tree= 跳过去。 */
		var canvasEl2 = document.getElementById('potree_render_area');
		function jumpToTree(id) {
			var embedded = /[?&]embed=1/.test(location.search) && window.parent !== window;
			if (embedded) {
				try { window.parent.postMessage({ type: 'bfers-select-tree', id: id }, '*'); } catch (e) {}
			} else {
				location.href = '../index.html?tree=' + encodeURIComponent(id) + '#treedata';
			}
		}
		canvasEl2.addEventListener('click', function (ev) {
			var best = null, bd = 144;
			for (var i = 0; i < DOTSCREEN.length; i++) {
				var s = DOTSCREEN[i];
				var dd = (s.x - ev.clientX) * (s.x - ev.clientX) + (s.y - ev.clientY) * (s.y - ev.clientY);
				if (dd < bd) { bd = dd; best = s; }
			}
			if (best && best.tree) { jumpToTree(best.tree); }
		});

		/* 点云按空间切成 9 块（整块八叉树 274 MB 超 GitHub 单文件 100 MB 上限），
		   这里一次全加载 —— 观感与整块一致，只是分成多个文件。 */
		var TILES = ['t0', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 't8'];
		var _left = TILES.length, _min = null, _max = null, _done = 0;

		/* 加载进度框：慢的时候让用户看得见在动 */
		function setLoadProgress(done, total, phase) {
			var bar = document.getElementById('loadBar'), sub = document.getElementById('loadSub'),
			    txt = document.getElementById('loadTxt');
			if (bar) bar.style.width = Math.round(done / Math.max(1, total) * 100) + '%';
			if (sub) sub.textContent = done + ' / ' + total;
			if (txt && phase) txt.textContent = phase;
		}
		function hideLoading() {
			var el = document.getElementById('loading');
			if (!el) return;
			el.classList.add('done');
			setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
		}
		function onAllLoaded() {
			window.__allLoaded = true;
			viewer.fitToScreen();
			/* 渐进加密：首屏先用 40 万点快出图，之后每隔几秒抬高预算。
			   自动镜头期间压到 40 万（画面一直在动，压低才不卡、也少下数据）。 */
			var steps = [400000, 900000, 1600000, 2400000, 3000000], si = 0;
			(function step() {
				if (++si >= steps.length) return;
				budgetWant = steps[si];
				applyBudget();
				setTimeout(step, 5000);
			}());
			if (_min) {
				var dx = _max[0] - _min[0], dy = _max[1] - _min[1], dz = _max[2] - _min[2];
				// 滚轮步长固定（Potree 默认按当前距离，远处快近处慢）
				if (viewer.orbitControls) viewer.orbitControls.scrollStep = Math.sqrt(dx * dx + dy * dy + dz * dz) * 0.07;
				window.PCBOX = { min: _min, max: _max };   /* 设备点越界过滤用 */
			}
			/* 9 块元数据都到位了，但首屏点还在流式加载 —— 等到真有可见点、且稳定一下再撤进度框 */
			var d = I18N[LANG] || {};
			setLoadProgress(TILES.length, TILES.length, d.loadRender || '正在渲染首屏…');
			var el = document.getElementById('loadSub'); if (el) el.textContent = '';
			var t0 = Date.now(), last = -1, still = 0;
			(function waitPoints() {
				var n = viewer.scene.pointclouds.reduce(function (s, c) { return s + c.numVisiblePoints; }, 0);
				if (n > 0 && n === last) { still++; } else { still = 0; }
				last = n;
				if ((n > 0 && still >= 2) || Date.now() - t0 > 30000) { hideLoading(); return; }
				setTimeout(waitPoints, 400);
			}());
			loadAnnotations();
		}
		setLoadProgress(0, TILES.length, (I18N[LANG] || {}).loadCloud || '正在加载三维点云…');
		setTimeout(hideLoading, 60000);     /* 兜底：万一某块下不来，别把进度框挂死 */
		TILES.forEach(function (t, idx) {
			Potree.loadPointCloud('./pointclouds/' + t + '/metadata.json', t, function (e) {

					catch (e) { console.info('[3d] 地面网格出错：' + (e && e.message ? e.message : e)); }

			});

			/* 周边高程：从烘焙网格双线性取值（terGrid 由 terrain.json 提供） */

				if (!terGrid || !terGrid.z) { return null; }
				var b = terGrid.bounds, n = terGrid.n;
				var p = proj4('EPSG:4326', 'EPSG:32650', [lon, lat]);
				var E = Math.max(b[0], Math.min(b[2], p[0]));    /* 越界夹到边缘，别让顶点掉到 0 */
				var N = Math.max(b[1], Math.min(b[3], p[1]));
				var fx = (E - b[0]) / (b[2] - b[0]) * n, fy = (b[3] - N) / (b[3] - b[1]) * n;
				var i = Math.min(n - 1, Math.max(0, Math.floor(fx))), j = Math.min(n - 1, Math.max(0, Math.floor(fy)));
				var u = fx - i, v = fy - j, z = terGrid.z;
				return (z[j * (n + 1) + i] * (1 - u) + z[j * (n + 1) + i + 1] * u) * (1 - v) +
				       (z[(j + 1) * (n + 1) + i] * (1 - u) + z[(j + 1) * (n + 1) + i + 1] * u) * v;
			}

			function demHeight(E, N) {                        /* 双线性取样地 DEM；界外返回 null */
				if (!dem) return null;
				var b = dem.bounds;
				if (E < b[0] || E > b[2] || N < b[1] || N > b[3]) return null;
				var fx = (E - b[0]) / (b[2] - b[0]) * (dem.nx - 1);
				var fy = (b[3] - N) / (b[3] - b[1]) * (dem.ny - 1);
				var ix = Math.min(dem.nx - 2, Math.floor(fx)), iy = Math.min(dem.ny - 2, Math.floor(fy));
				var u = fx - ix, v = fy - iy, z = dem.z;
				return (z[iy * dem.nx + ix] * (1 - u) + z[iy * dem.nx + ix + 1] * u) * (1 - v) +
				       (z[(iy + 1) * dem.nx + ix] * (1 - u) + z[(iy + 1) * dem.nx + ix + 1] * u) * v;

			function makeMesh() {
				/* 基准对齐：样地中心处 DEM 与全球高程的差值 */
				var off = 0;
				var dC = demHeight(cx, cy), tC = terHeight(wgs[0][0], wgs[0][1]);
				if (dC != null && tC != null) {
					var wc = proj4('EPSG:32650', 'EPSG:4326', [cx, cy]);
					tC = terHeight(wc[1], wc[0]);

				}
				/* 页面别处要用任意点的地面高程（生活区/林场/大样地/白桦林都在 DEM 之外，
				   只能取全球高程 + 上面这个基准差）。 */
				window.groundZ = function (E, N) {
					var dz = demHeight(E, N);
					if (dz != null) return dz;
					var w2 = proj4('EPSG:32650', 'EPSG:4326', [E, N]);
					var th = terHeight(w2[1], w2[0]);

				var verts = geo.vertices || [];
				/* 顶点顺序：行 0 在北（+Y），列 0 在西（-X） */
				for (var iy = 0; iy < VN; iy++) {
					for (var ix = 0; ix < VN; ix++) {
						var vi = iy * VN + ix;
						if (!verts[vi]) continue;
						var E = cx - S / 2 + S * ix / SEG;
						var N = cy + S / 2 - S * iy / SEG;
						var dz = demHeight(E, N);
						var w = proj4('EPSG:32650', 'EPSG:4326', [E, N]);
						var th = terHeight(w[1], w[0]);
						var zz;
						if (dz != null && th != null) {
							/* 界内用 DEM；离边界 150 m 内与全球高程做过渡 */
							var b = dem.bounds;
							var dist = Math.min(E - b[0], b[2] - E, N - b[1], b[3] - N);
							var t = Math.min(1, Math.max(0, dist / 150));
							zz = dz * t + (th + off) * (1 - t);
						} else if (dz != null) { zz = dz; }
						else if (th != null) { zz = th + off; }
						else { zz = dC != null ? dC : c.min[2]; }
						verts[vi].z = zz;
					}

				if ('verticesNeedUpdate' in geo) geo.verticesNeedUpdate = true;
				if (geo.computeVertexNormals) geo.computeVertexNormals();

				if ('minFilter' in tex) tex.minFilter = 1006;
				var mat = new P.Mat({ map: tex });
				mat.side = 2;
				var mesh = new P.Mesh(geo, mat);
				mesh.position.set(cx, cy, 0);            /* 顶点 z 已是绝对高程，这里不平移 */
				mesh.scale.set(S, S, 1);
				mesh.visible = GROUND_ON;
				viewer.scene.scene.add(mesh);
				var old2 = GROUND;                       /* 先建好新的，再撤旧的：中间不留空窗 */
				GROUND = mesh;
				if (old2 && old2 !== mesh) { viewer.scene.scene.remove(old2); }
				console.info('[3d] 地形地面已铺好：影像 ' + imgOK + ' 张、高程网格 ' + (terGrid ? '本地' : '无') + '、基准差 ' +
				             Math.round(off) + ' m');

		}

		/* ---------------- 其他台站（小五台 / 驼梁）的局部三维地面 ----------------
		 * 这两处离东灵山 35 / 130 km，不在本站那块 3.2 km 地面里。切过去时现建一小块
		 * 4 km 见方的地形（terrarium 全球高程 + 天地图影像，与本站地面同一套数据源），
		 * 再画上该站的样方框 —— 做法与二维一致，数据同一份 js/stations.js。 */
		var STA_GROUND = {}, STA_RING = {}, STA_ACTIVE = null;
		var STA_S = 4000, STA_SEG = 80;

		function buildStationGround(key, st) {
			if (STA_GROUND[key]) { return STA_GROUND[key]; }
			var P = findProtos();
			if (!P) { return null; }
			var S = STA_S, SEG = STA_SEG, VN = SEG + 1;
			var c = proj4('EPSG:4326', 'EPSG:32650', [st.lon, st.lat]);
			var cx = c[0], cy = c[1];

			               [cx + S / 2, cy + S / 2], [cx - S / 2, cy + S / 2]];
			var wgs = corners.map(function (p) {

			           latMax: Math.max.apply(null, wgs.map(function (p) { return p[0]; })),
			           lonMin: Math.min.apply(null, wgs.map(function (p) { return p[1]; })),
			           lonMax: Math.max.apply(null, wgs.map(function (p) { return p[1]; })) };

			var x0 = Math.floor((bI.lonMin + 180) / 360 * n), x1 = Math.floor((bI.lonMax + 180) / 360 * n);
			var y0 = Math.floor(merc(bI.latMax, 0)[1] * n), y1 = Math.floor(merc(bI.latMin, 0)[1] * n);
			var nx = x1 - x0 + 1, ny = y1 - y0 + 1;
			if (nx * ny > 64 || nx < 1 || ny < 1) { return null; }

			cv.width = nx * 256; cv.height = ny * 256;
			var ictx = cv.getContext('2d');
			/* 高程：读预先烘焙的本地网格（小五台 terrain_xwt.json / 驼梁 terrain_tl.json），
			   不再运行期取 AWS terrarium —— 国内取不到会让地形拍成一块平板。 */
			var terFile = (key === 'xiaowutai') ? 'terrain_xwt.json' : 'terrain_tl.json';
			var terGridP = getJSON(terFile).catch(function () { return null; });
			var jobs = [], tiles = [], imgOK = 0, terOK = 0;
			for (var ix = 0; ix < nx; ix++) for (var iy = 0; iy < ny; iy++) {
				(function (ix, iy) {
					jobs.push(loadImage(groundTileURL(x0 + ix, y0 + iy, ZI, ix + iy)).then(function (im) {
						tiles.push({ ix: ix, iy: iy, im: im, st: tileStats(im) }); imgOK++;
					}).catch(function () {}));

			}
			var terGrid = null;
			function terAt(lat, lon) {
				if (!terGrid || !terGrid.z) { return null; }

				var E = Math.max(b[0], Math.min(b[2], q[0]));
				var N = Math.max(b[1], Math.min(b[3], q[1]));
				var fx = (E - b[0]) / (b[2] - b[0]) * nn, fy = (b[3] - N) / (b[3] - b[1]) * nn;
				var i = Math.min(nn - 1, Math.max(0, Math.floor(fx))), j = Math.min(nn - 1, Math.max(0, Math.floor(fy)));
				var u = fx - i, v = fy - j, z = terGrid.z;
				return (z[j * (nn + 1) + i] * (1 - u) + z[j * (nn + 1) + i + 1] * u) * (1 - v) +
				       (z[(j + 1) * (nn + 1) + i] * (1 - u) + z[(j + 1) * (nn + 1) + i + 1] * u) * v;
			}
			var api = { id: key, cx: cx, cy: cy, S: S, mesh: null, base: 0, ready: false };
			STA_GROUND[key] = api;

			Promise.all(jobs.concat([terGridP])).then(function (res) {
				terGrid = res[res.length - 1] || null;
				if (!imgOK) { console.info('[3d] ' + st.nameZh + ' 影像瓦片全失败，跳过'); return; }
				if (!terGrid) { console.info('[3d] ' + st.nameZh + ' 本地高程网格取不到，跳过'); return; }
				var ref = null;
				if (tiles.length) {
					var sum = [0, 0, 0], sum2 = [0, 0, 0];
					tiles.forEach(function (t) { for (var k = 0; k < 3; k++) { sum[k] += t.st.mean[k]; sum2[k] += t.st.sd[k]; } });
					ref = { mean: [], sd: [] };
					for (var j = 0; j < 3; j++) { ref.mean[j] = sum[j] / tiles.length; ref.sd[j] = sum2[j] / tiles.length; }
				}
				tiles.forEach(function (t) { ictx.drawImage(toneMatch(t.im, t.st, ref, 0.7), t.ix * 256, t.iy * 256); });

				function hAt(E, N) {
					var w = proj4('EPSG:32650', 'EPSG:4326', [E, N]);
					return terAt(w[1], w[0]);
				}
				var geo = new P.Geo(1, 1, SEG, SEG), verts = geo.vertices || [], zs = [];
				for (var iy2 = 0; iy2 < VN; iy2++) for (var ix2 = 0; ix2 < VN; ix2++) {
					var vi = iy2 * VN + ix2;
					if (!verts[vi]) { continue; }
					var E = cx - S / 2 + S * ix2 / SEG, N2 = cy + S / 2 - S * iy2 / SEG;
					var z = hAt(E, N2);
					if (z == null) { z = 0; }
					verts[vi].z = z; zs.push(z);
				}
				if ('verticesNeedUpdate' in geo) { geo.verticesNeedUpdate = true; }
				if (geo.computeVertexNormals) { geo.computeVertexNormals(); }
				var tex = new P.Tex(cv);
				tex.needsUpdate = true;
				if ('generateMipmaps' in tex) { tex.generateMipmaps = false; }
				if ('minFilter' in tex) { tex.minFilter = 1006; }
				var mat = new P.Mat({ map: tex });
				mat.side = 2;
				var mesh = new P.Mesh(geo, mat);
				mesh.position.set(cx, cy, 0);
				mesh.scale.set(S, S, 1);
				mesh.visible = false;
				viewer.scene.scene.add(mesh);
				api.mesh = mesh;
				api.base = zs.length ? Math.min.apply(null, zs) : 0;
				/* 样方框 + 名称标签 */
				STA_RING[key] = (st.plots || []).map(function (p) {
					var ring = p.pts.map(function (q) {
						var u = proj4('EPSG:4326', 'EPSG:32650', [q[1], q[0]]);
						var z = hAt(u[0], u[1]);
						return [u[0], u[1], (z == null ? api.base : z) + 1.5];
					});
					var m = ring.length, ax = 0, ay = 0, az = 0;
					for (var i = 0; i < m; i++) { ax += ring[i][0]; ay += ring[i][1]; az += ring[i][2]; }
					addLabel(ax / m, ay / m, az / m + 25, p.nameZh, 'log', null, p.name);
					return { ring: ring };
				});
				api.ready = true;
				if (STA_ACTIVE === key) { flyStation(key); }
				console.info('[3d] ' + st.nameZh + ' 局部地形已建好：影像 ' + imgOK + ' 张、高程网格 ' + (terGrid ? '本地' : '无'));
			});
			return api;
		}

		/* 切台站：只显示选中那块的局部地形，并把镜头飞过去；key 为空 = 回本站 */
		function flyStation(key) {
			STA_ACTIVE = key || null;
			Object.keys(STA_GROUND).forEach(function (k) {
				if (STA_GROUND[k].mesh) { STA_GROUND[k].mesh.visible = (k === STA_ACTIVE); }
			});
			var v = viewer.scene.view, P = viewer.scene.view.position;
			if (!STA_ACTIVE) {
				if (window.PCBOX) {
					var c = window.PCBOX;
					var mx = (c.min[0] + c.max[0]) / 2, my = (c.min[1] + c.max[1]) / 2;
					P.set(mx, my - 700, 1900);
					v.lookAt(new (P.constructor)(mx, my, 1200));
				}
				return;
			}
			var st = (typeof STATIONS !== 'undefined') ? STATIONS[STA_ACTIVE] : null;
			if (!st) { return; }
			var api = STA_GROUND[STA_ACTIVE] || buildStationGround(STA_ACTIVE, st);
			if (api && api.ready) {
				P.set(api.cx, api.cy - api.S * 0.3, api.base + 1300);
				v.lookAt(new (P.constructor)(api.cx, api.cy, api.base));
			}
		}

		/* 台站切换按钮条（切语言要重建，所以单独一个函数） */
		function renderStaBar() {
			var bar = document.getElementById('staBar');
			if (!bar || typeof STATIONS === 'undefined') { return; }
			bar.innerHTML = '';
			function mk(label, key, on) {
				var b = document.createElement('button');
				b.className = 'sbtn' + (on ? ' on' : '');
				b.type = 'button';
				b.textContent = label;
				b.addEventListener('click', function () {
					Array.prototype.forEach.call(bar.querySelectorAll('.sbtn'), function (x) { x.classList.remove('on'); });
					b.classList.add('on');
					flyStation(key);
				});
				bar.appendChild(b);
			}
			mk((I18N[LANG] || {}).staDl || '东灵山（本站）', null, !STA_ACTIVE);
			Object.keys(STATIONS).forEach(function (k) {
				var st = STATIONS[k];
				mk((LANG === 'zh') ? st.nameZh : st.name, k, STA_ACTIVE === k);
			});
		}

		function findProtos() {
			var protos = null;
			function walk(o, d) {
				if (!o || d > 6 || protos) return;
				if (o.isMesh && o.geometry && o.material && o.material.map) {
					protos = { Mesh: o.constructor, Geo: o.geometry.constructor,
					           Mat: o.material.constructor, Tex: o.material.map.constructor };
				}
				(o.children || []).forEach(function (k) { walk(k, d + 1); });
			}
			walk(viewer.navigationCube, 0);
			walk(viewer.compass, 0);
			return protos;
		}



		/* ---------------- 自动镜头 ----------------
		 * 4 条预设轨迹，点按钮画面自己动；再点同键、或用户一动手就停。
		 * 轨迹只用「相机位置 + 注视点」两个量描述，不依赖全局 THREE。 */
		var CAM = { on: false, name: null, t0: 0 };
		var CAM_DUR = { orbit: 60000, flyover: 45000, dolly: 50000, rise: 50000 };
		var CAM_SPEEDS = [0.5, 1, 2], camSpeedIdx = 1, CAM_LOOP = true;
		/* 注意：函数不能叫 camSpeed —— 按钮 id="camSpeed" 会生成同名全局变量，撞名会让脚本早退 */
		var camSpeedNow = function () { return CAM_SPEEDS[camSpeedIdx]; };
		var budgetWant = 400000;
		function applyBudget() {
			viewer.setPointBudget(CAM.on ? Math.min(700000, budgetWant) : budgetWant);
		}
		var ease = function (x) { return x * x * (3 - 2 * x); };        /* smoothstep */
		var tri = function (t) { return 1 - Math.abs(2 * t - 1); };     /* 往返 0→1→0 */

		function camRef() {
			var c = window.PCBOX;
			if (!c) return null;
			var cx = (c.min[0] + c.max[0]) / 2, cy = (c.min[1] + c.max[1]) / 2;
			var R = Math.max(c.max[0] - c.min[0], c.max[1] - c.min[1]) * 0.5;
			/* 注视高度取实际点的中位高程 —— 八叉树包围盒的 z 是立方体、不是地形 */

			for (var i = 0; i < DOTPTS.length; i++) { var z = DOTPTS[i].Z; if (isFinite(z)) zs.push(z); }
			zs.sort(function (a, b) { return a - b; });

		function camPose(name, T) {

			if (name === 'orbit') {                    /* 环绕：匀速转一圈 */
				a = T * Math.PI * 2;

				         t: [cx, cy, zc] };
			}
			if (name === 'flyover') {                  /* 低空巡航：沿固定方向来回掠飞（样地在坡上，得抬高+俯视，不然会贴着坡面侧看） */
				a = -Math.PI * 0.32;

		var CAM_ORDER = ['orbit', 'flyover', 'dolly', 'rise'];

		}
		function camStep(now) {
			if (!CAM.on) return;
			var view = viewer.scene.view;

			/* 过渡中：把相机从上一段终点缓动到这一段起点 */
			if (CAM_BLEND) {
				var u = (now - CAM_BLEND.start) / CAM_TRANS;

					camApply(view,
						[0, 1, 2].map(function (i) { return CAM_BLEND.p0[i] + (CAM_BLEND.p1[i] - CAM_BLEND.p0[i]) * e; }),
						[0, 1, 2].map(function (i) { return CAM_BLEND.t0[i] + (CAM_BLEND.t1[i] - CAM_BLEND.t0[i]) * e; }));

			}

			var dur = CAM_DUR[CAM.name];
			var el = (now - CAM.t0) * camSpeedNow();          /* 已播时长（含倍速） */
			if (el >= dur) {
				if (!CAM_LOOP) { camStopNow(); return; }         /* 不连播：播完一遍就停 */
				/* 连播：换到下一条轨迹，并做平滑过渡（不是硬切） */
				var from = camPoseNow(view);
				var i = CAM_ORDER.indexOf(CAM.name);
				CAM.name = CAM_ORDER[(i + 1) % CAM_ORDER.length];
				var to = camPose(CAM.name, 0);
				if (to) { CAM_BLEND = { p0: from.p, t0: from.t, p1: to.p, t1: to.t, start: now }; }
				CAM.t0 = now; el = 0;
				camMark();
				return;
			}
			var pose = camPose(CAM.name, el / dur);
			if (!pose) return;
			camApply(view, pose.p, pose.t);
		}

		function camMark() {
			var bs = document.querySelectorAll('#camBar .cbtn[data-cam]');
			for (var i = 0; i < bs.length; i++) {
				bs[i].classList.toggle('active', CAM.on && bs[i].getAttribute('data-cam') === CAM.name);
			}
		}
		function camStart(name) {
			if (!window.PCBOX) { return; }              /* 点云还没就绪 */
			var view = viewer.scene.view;
			var from = camPoseNow(view);
			CAM.on = true; CAM.name = name; CAM.t0 = performance.now();
			/* 从当前机位平滑飞入这条轨迹的起点，而不是"瞬移"过去 */
			var to = camPose(name, 0);
			CAM_BLEND = to ? { p0: from.p, t0: from.t, p1: to.p, t1: to.t, start: CAM.t0 } : null;
			camMark(); applyBudget();
		}
		function camStopNow() {
			if (!CAM.on) return;
			CAM.on = false; camMark(); applyBudget();
		}
		(function bindCam() {
			var bs = document.querySelectorAll('#camBar .cbtn[data-cam]');
			for (var i = 0; i < bs.length; i++) {
				(function (b) {
					b.addEventListener('click', function () {
						var n = b.getAttribute('data-cam');
						if (CAM.on && CAM.name === n) { camStopNow(); } else { camStart(n); }
					});
				}(bs[i]));
			}
			var st = document.getElementById('camStop');
			if (st) st.addEventListener('click', camStopNow);
			/* 速度：点一下在 0.5× / 1× / 2× 之间循环 */
			var sp = document.getElementById('camSpeed');
			if (sp) sp.addEventListener('click', function () {
				camSpeedIdx = (camSpeedIdx + 1) % CAM_SPEEDS.length;
				sp.textContent = ((I18N[LANG] || {}).camSpeed || '速度') + ' ' + camSpeedNow() + '×';
			});
			/* 循环：开 = 四条轨迹依次连播；关 = 播完当前这条就停 */
			var lp = document.getElementById('camLoop');
			if (lp) {
				lp.title = '开：四条轨迹依次连播　关：只播当前这条';
				lp.addEventListener('click', function () {
					CAM_LOOP = !CAM_LOOP;
					lp.classList.toggle('active', CAM_LOOP);
				});
			}
			/* 用户一动手就停，不跟他抢控制权 */
			['mousedown', 'wheel', 'touchstart'].forEach(function (ev) {
				var el = document.getElementById('potree_render_area');
				if (el) el.addEventListener(ev, function () { camStopNow(); }, { passive: true });
			});
		}());

		/* ---------------- 拟真 3D 指南针 ----------------
		 * 倾斜的立体表盘：金属外圈 + 刻度 + 方位字母 + 红北针 + 玻璃高光。
		 * 跟相机实时同步：表盘随相机转，N 始终指向真实北方向。
		 * 场景是 Z 向上、+Y 为北，所以相机朝向在水平面的投影 atan2(f.x, f.y) 就是方位角。
		 * 每帧只在方位变化超过 0.3° 才重画，避免无谓开销。 */
		var CMP = { cv: null, ctx: null, last: null, lastPitch: null };
		/* 相机姿态：方位角（平面转）+ 俯仰角（决定罗盘被看扁多少）。
		   罗盘按「平放在地面上的实体盘」来画：俯视是正圆，平视压成一条椭圆。 */
		function compassPose() {
			var cam = viewer.scene.getActiveCamera();
			if (!cam) { return null; }
			var m = cam.matrixWorld.elements;
			var fx = -m[8], fy = -m[9], fz = -m[10];
			var L = Math.sqrt(fx * fx + fy * fy + fz * fz) || 1;
			return {
				az: Math.atan2(fx, fy) * 180 / Math.PI,                       /* 0=北, 90=东 */
				pitch: Math.asin(Math.max(-1, Math.min(1, fz / L))) * 180 / Math.PI   /* -90=俯视, 0=平视 */
			};
		}
		function compassAzimuth() {                 /* 兼容旧调用 */
			var p = compassPose();
			return p ? p.az : null;
		}
		function drawCompass(az, pitch) {
			var cv = CMP.cv, ctx = CMP.ctx;
			if (!cv) { return; }
			var W = cv.width, H = cv.height, cx = W / 2, cy = H / 2 + H * 0.06;
			var R = W * 0.42;
			/* 俯仰同步：平视(0°)压到 0.22，俯视(-90°)是正圆 1.0 */
			var TILT = 0.22 + 0.78 * Math.abs(Math.sin((pitch || 0) * Math.PI / 180));
			var THICK = H * 0.045 * TILT;
			ctx.clearRect(0, 0, W, H);
			/* 盘身厚度 + 投影 */
			ctx.beginPath();
			ctx.ellipse(cx, cy + THICK, R, R * TILT, 0, 0, Math.PI * 2);
			var g0 = ctx.createLinearGradient(0, cy - R, 0, cy + R + THICK);
			g0.addColorStop(0, 'rgba(74,63,46,.95)');
			g0.addColorStop(1, 'rgba(26,22,16,.95)');
			ctx.fillStyle = g0; ctx.fill();
			/* 盘面：先在盘面内旋转，再按倾斜投影压扁 */
			ctx.save();
			ctx.translate(cx, cy);
			ctx.scale(1, TILT);
			ctx.rotate(-az * Math.PI / 180);
			var gm = ctx.createLinearGradient(-R, -R, R, R);
			gm.addColorStop(0, '#dcc98f'); gm.addColorStop(.35, '#8c7538');
			gm.addColorStop(.55, '#f2e5b4'); gm.addColorStop(1, '#6f5a28');
			ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = gm; ctx.fill();
			var gd = ctx.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R * .92);
			gd.addColorStop(0, '#fcf8ec'); gd.addColorStop(1, '#dbcdac');
			ctx.beginPath(); ctx.arc(0, 0, R * 0.86, 0, Math.PI * 2); ctx.fillStyle = gd; ctx.fill();
			for (var d = 0; d < 360; d += 5) {
				var a = (d - 90) * Math.PI / 180;
				var major = (d % 30 === 0), card = (d % 90 === 0);
				var r1 = R * 0.82, r2 = R * (card ? 0.60 : (major ? 0.68 : 0.75));
				ctx.beginPath();
				ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
				ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
				ctx.lineWidth = card ? 3.2 : (major ? 2.2 : 1);
				ctx.strokeStyle = card ? '#3a3020' : 'rgba(60,50,35,.75)';
				ctx.stroke();
			}
			ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
			[['N', 0, '#c0392b', 1.18], ['E', 90, '#3a3020', 1], ['S', 180, '#3a3020', 1], ['W', 270, '#3a3020', 1]]
				.forEach(function (q) {
					var a = (q[1] - 90) * Math.PI / 180;
					ctx.font = 'bold ' + Math.round(R * 0.30 * q[3]) + 'px Georgia,"Times New Roman",serif';
					ctx.fillStyle = q[2];
					ctx.fillText(q[0], Math.cos(a) * R * 0.50, Math.sin(a) * R * 0.50);
				});
			function needle(len, w, col) {
				ctx.beginPath();
				ctx.moveTo(0, -len); ctx.lineTo(w, 0); ctx.lineTo(0, len * 0.10); ctx.lineTo(-w, 0);
				ctx.closePath();
				ctx.fillStyle = col; ctx.fill();
				ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(40,32,20,.55)'; ctx.stroke();
			}
			needle(R * 0.68, R * 0.085, '#c0392b');
			ctx.save(); ctx.rotate(Math.PI); needle(R * 0.68, R * 0.085, '#6b6152'); ctx.restore();
			ctx.beginPath(); ctx.arc(0, 0, R * 0.075, 0, Math.PI * 2);
			ctx.fillStyle = '#f2e9d2'; ctx.fill();
			ctx.lineWidth = 1.4; ctx.strokeStyle = '#8c7538'; ctx.stroke();
			ctx.restore();
			/* 玻璃高光（不随盘面转） */
			ctx.save();
			ctx.beginPath();
			ctx.ellipse(cx, cy, R * 0.86, R * 0.86 * TILT, 0, 0, Math.PI * 2);
			var gh = ctx.createLinearGradient(cx - R, cy - R, cx + R * .4, cy + R * .5);
			gh.addColorStop(0, 'rgba(255,255,255,.34)');
			gh.addColorStop(.45, 'rgba(255,255,255,.06)');
			gh.addColorStop(1, 'rgba(255,255,255,0)');
			ctx.fillStyle = gh; ctx.fill();
			ctx.restore();
			ctx.beginPath();
			ctx.ellipse(cx, cy, R, R * TILT, 0, 0, Math.PI * 2);
			ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(30,26,18,.75)'; ctx.stroke();
		}
		function compassStep() {
			if (!CMP.cv) {
				CMP.cv = document.getElementById('compass3d');
				if (!CMP.cv) { return; }
				CMP.ctx = CMP.cv.getContext('2d');
			}
			var pose = compassPose();
			if (!pose) { return; }
			if (CMP.last != null && Math.abs(pose.az - CMP.last) < 0.3 &&
			    Math.abs(pose.pitch - CMP.lastPitch) < 0.3) { return; }
			CMP.last = pose.az; CMP.lastPitch = pose.pitch;
			drawCompass(pose.az, pose.pitch);
		}

		/* 地面触发兜底：渲染循环里检查一次条件，满足就铺（buildGround 内部自带重试）。
		   只尝试一次，避免每帧重复发起。 */
		var GROUND_TRY = 0;
		function ensureGround() {
			if (GROUND || GROUND_TRY > 0) { return; }
			if (!window.PCBOX || !DOTPTS.length) { return; }
			GROUND_TRY++;
			buildGround();
		}

		(function loop() {
			var now = performance.now();
			if (CAM.on) camStep(now);
			ensureGround(); project(); drawDots(); ensureSiteZ(); ensureMicroZ(); ensureFacZ(); drawBounds(); drawCells(); compassStep();
			requestAnimationFrame(loop);
		})();
	</script>
	<style>
		.lg3d b { display:inline-block; background:#c2703d; color:#fff; font-size:9px; font-weight:700;
			padding:0 3px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.6); }

		/* 窄屏修正（必须放在基础规则之后，否则被 .layers-panel / #legend3d 的原规则盖掉）
		 * 实测：顶栏一换行 .layers 就落到左边，面板锚右 → 整块被挤出屏幕外，
		 * 手机上只剩 10px 白边、图层根本点不到。 */
		@media (max-width: 900px) {
			/* 900 以下镜头条会顶到右下角图例（768 宽实测压住 63x10px），把图例抬起来 */
			#legend3d { bottom: 66px; max-height: calc(100vh - 460px); overflow-y: auto; }
		}
		@media (max-width: 640px) {
			.layers-panel { left: 0; right: auto; top: 44px; max-height: calc(100vh - 300px); display: none; }
			.layers-panel.open { display: block; }         /* 窄屏默认收起，点「图层」才展开 */
			.lbtn { display: inline-block; }
			.layers-panel label { padding: 7px 4px; }      /* 手机上手指要够大 */
			/* 手机上底部被镜头条+图例占满，提示条会压在图上；而且「右键拖动」对触屏也不适用 */
			#ctrlHint { display: none; }
		}
		/* 更窄的屏：图例限宽，别钻到左边面板底下（面板 z-index 更高，会把它左半边盖住） */
		@media (max-width: 430px) {
			#legend3d { max-width: 40vw; }
		}
	</style>
</body>
