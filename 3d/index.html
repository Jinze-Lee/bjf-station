<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>北京森林站 · 三维林相</title>

	<link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
	<link rel="stylesheet" type="text/css" href="../css/leaflet.css">

	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #14170f;
			font-family: Raleway, "Segoe UI", "Microsoft YaHei", sans-serif; }
		#potree_render_area { background: radial-gradient(circle at 50% 40%, #232a1c 0%, #12150e 70%, #0b0d08 100%); }

		/* 顶部标题栏 */
		#topbar {
			position: fixed; left: 0; right: 0; top: 0; z-index: 2000;
			display: flex; align-items: center; gap: 14px;
			padding: 10px 16px; pointer-events: none;
			background: linear-gradient(180deg, rgba(10,13,8,.82), rgba(10,13,8,0));
		}
		#topbar .brand { color: #d7d2c6; font-size: 15px; font-weight: 700; letter-spacing: .3px;
			text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: auto; }
		#topbar .brand small { display:block; font-weight: 400; opacity: .72; font-size: 11px; letter-spacing: 0; }
		#topbar .spacer { flex: 1; }
		#topbar a.btn, #topbar button.btn {
			pointer-events: auto; cursor: pointer; text-decoration: none;
			color: #e7e3d8; background: rgba(38,42,30,.72); border: 1px solid rgba(160,180,120,.35);
			border-radius: 6px; padding: 7px 13px; font-size: 13px; font-family: inherit;
		}
		#topbar a.btn:hover, #topbar button.btn:hover { background: rgba(58,72,40,.85); color: #fff; }
		@media (max-width: 640px) {
			#topbar { flex-wrap: wrap; row-gap: 6px; padding: 8px 10px; }
			#topbar .spacer { display: none; }
			#topbar .brand { flex-basis: 100%; font-size: 13px; }
			#topbar .brand small { display: none; }
			#potree_sidebar_container { top: 84px !important; }
		}

		/* 右上角图层控件（常开，白底可选面板，同 2D 地图） */
		.layers { position: relative; pointer-events: auto; }
		.layers-panel { position: absolute; right: 0; top: 4px; z-index: 2100;
			background: #fff; color: #333; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.4);
			padding: 10px 14px 8px; min-width: 170px; }
		.layers-panel .lp-cap { font-size: 12px; font-weight: 700; color: #666;
			letter-spacing: .5px; margin: 0 0 4px; }
		.layers-panel label { display: block; padding: 6px 4px; font-size: 14px; cursor: pointer;
			user-select: none; white-space: nowrap; border-radius: 4px; }
		.layers-panel label:hover { background: rgba(108,161,74,.14); }
		.layers-panel input { margin-right: 7px; vertical-align: middle; width: 15px; height: 15px;
			accent-color: #2f6fdb; cursor: pointer; }

		/* 三维场景里的浮动标签 */
		#labels { position: fixed; inset: 0; z-index: 1500; pointer-events: none; overflow: hidden; }
		.lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
			white-space: nowrap; font-size: 11px; color: #fff; padding: 2px 6px; border-radius: 10px;
			background: rgba(28,33,22,.78); border: 1px solid rgba(160,180,120,.5);
			box-shadow: 0 1px 4px rgba(0,0,0,.5); }
		.lbl.tree { background: rgba(40,74,40,.86); }
		.lbl.log { background: rgba(122,66,28,.9); font-weight: 700; }
		.lbl:hover { background: #6ca14a; border-color: #fff; }
		.lbl.hidden { display: none; }
		#tip { position: fixed; z-index: 1600; pointer-events: none; max-width: 240px; display: none;
			background: rgba(20,24,15,.95); color: #ddd7cd; border: 1px solid rgba(160,180,120,.4);
			border-radius: 6px; padding: 7px 10px; font-size: 12px; line-height: 1.5; }

		/* 实测点（主树/样方内树）画布圆点 */
		#dots { position: fixed; inset: 0; z-index: 1400; pointer-events: none; }

		/* 图例 */
		#legend3d { position: fixed; right: 12px; bottom: 12px; z-index: 1900;
			background: rgba(20,24,15,.82); border: 1px solid rgba(160,180,120,.3);
			border-radius: 6px; padding: 8px 11px; font-size: 11.5px; color: #d3cec1; line-height: 1.75; }
		#legend3d i { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
			margin-right: 6px; vertical-align: middle; }
		#legend3d i.mon  { background: #6ca14a; }
		#legend3d i.log  { background: #c2703d; }
		#legend3d i.main { background: #8fb4d6; }
		#legend3d i.tree { background: #d3a970; }
		#legend3d i.det  { background: linear-gradient(90deg,#4f7a52,#b3903a,#c06a3c); }
		#legend3d .sl3d { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(160,180,120,.3); max-width: 210px; }
		#legend3d .sl3d-i { display: inline-block; margin: 0 8px 2px 0; }
		#legend3d .sl3d-i i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
			margin-right: 4px; vertical-align: middle; }
		/* 树种数量柱状图 */
		#legend3d .bars { margin-top: 4px; }
		#legend3d .bar-row { display: flex; align-items: center; margin: 2px 0; font-size: 11.5px; }
		#legend3d .bar-name { width: 52px; flex: none; text-align: right; padding-right: 7px;
			color: #cfd4c4; white-space: nowrap; }
		#legend3d .bar-track { flex: 1; height: 11px; background: rgba(255,255,255,.07);
			border-radius: 3px; overflow: hidden; }
		#legend3d .bar { display: block; height: 100%; border-radius: 3px 2px 2px 3px; }
		#legend3d .bar-n { width: 36px; flex: none; text-align: left; padding-left: 6px;
			color: #aeb59f; font-size: 10.5px; }
		@media (max-width: 640px) { #legend3d { font-size: 10.5px; padding: 6px 8px; } }

		/* 操作提示（相机只有环绕一种模式：左键旋转 · 中键平移 · 滚轮缩放） */
		#ctrlHint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 1900;
			background: rgba(20,24,15,.72); color: #d7d2c6; pointer-events: none;
			border: 1px solid rgba(160,180,120,.28); border-radius: 6px; padding: 6px 13px; font-size: 12.5px; }
		@media (max-width: 640px) { #ctrlHint { font-size: 11px; padding: 5px 10px; bottom: 10px; } }

		.potree_container { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
		/* 把 Potree 的菜单按钮下移，避免和顶部标题重叠 */
		#potree_sidebar_container { top: 46px !important; display: none !important; }
		#potree_menu_button { display: none !important; }   /* 左上角 Potree 自带的小按钮，金总看不懂 */
		#potree_map_toggle { display: none !important; }    /* 左上角那个小地图缩略图开关，同上 */
		#potree_quick_buttons { display: none !important; }
	</style>
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>
	<script src="../js/leaflet.js"></script>
	<script src="../js/devices.js"></script>

	<div id="topbar">
		<div class="brand"><span id="bt">北京森林生态系统定位研究站 · 三维林相</span>
			<small id="bs">无人机 LiDAR 彩色点云 · 高德卫星底图 · 20 棵监测树 / 3 台数采</small></div>
		<div class="spacer"></div>
		<div class="layers" id="layersBox">
			<div class="layers-panel open" id="layersPanel">
				<div class="lp-cap" id="lblLayers">图层</div>
				<label><input type="checkbox" id="chkDet" checked> <span id="lblDet">单木覆盖</span></label>
				<label><input type="checkbox" id="chkBnd" checked> <span id="lblBnd">样地边界</span></label>
				<label><input type="checkbox" id="chkG20"> <span id="lblG20">20 m 网格</span></label>
				<label><input type="checkbox" id="chkG40"> <span id="lblG40">40 m 网格</span></label>
				<label><input type="checkbox" id="chkDrain"> <span id="lblDrain">水系</span></label>
				<label><input type="checkbox" id="chkNum"> <span id="lblNum">格网编号（VIT/T）</span></label>
				<label><input type="checkbox" id="chkSap"> <span id="lblSap">液流</span></label>
				<label><input type="checkbox" id="chkDen"> <span id="lblDen">径向生长</span></label>
				<label><input type="checkbox" id="chkLai"> <span id="lblLai">LAI</span></label>
			</div>
		</div>
		<button class="btn" id="langBtn">EN</button>
		<a class="btn" href="../index.html" id="backBtn">← 返回网站</a>
	</div>
	<div id="ctrlHint"></div>

	<div id="labels"></div>
	<div id="tip"></div>
	<canvas id="dots"></canvas>
	<div id="legend3d"></div>

	<div class="potree_container">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script>
		var I18N = {
			zh: { title: '北京森林生态系统定位研究站 · 三维林相',
			      sub: '无人机 LiDAR 彩色点云 · 高德卫星底图 · 20 棵监测树 / 3 台数采',
			      back: '← 返回网站', lang: 'EN',
			      layers: '图层', lLayers: '图层', lDet: '单木覆盖', lBnd: '样地边界',
			      lG20: '20 m 网格', lG40: '40 m 网格', lDrain: '水系', lNum: '格网编号（VIT/T）',
			      lSap: '液流', lDen: '径向生长', lLai: 'LAI' },
			en: { title: 'Beijing Forest Ecosystem Research Station · 3D Canopy',
			      sub: 'UAV LiDAR colour point cloud · AMap satellite · 20 monitored trees / 3 loggers',
			      back: '← Back to site', lang: '中文',
			      layers: 'Layers', lLayers: 'Layers', lDet: 'Tree cover', lBnd: 'Plot boundaries',
			      lG20: '20 m grid', lG40: '40 m grid', lDrain: 'Drainage', lNum: 'Grid IDs (VIT/T)',
			      lSap: 'Sap flow', lDen: 'Dendrometer', lLai: 'LAI' }
		};
		var LANG = localStorage.getItem('bfers-3d-lang') || 'zh';
		function applyLang() {
			var d = I18N[LANG];
			document.documentElement.lang = LANG;
			document.getElementById('bt').textContent = d.title;
			document.getElementById('bs').textContent = d.sub;
			document.getElementById('backBtn').textContent = d.back;
			document.getElementById('langBtn').textContent = d.lang;
			var ch = document.getElementById('ctrlHint');
			if (ch) ch.textContent = d.ctrlHint;
			var lb = document.getElementById('lblLayers'); if (lb) lb.textContent = d.lLayers;
			lb = document.getElementById('lblDet'); if (lb) lb.textContent = d.lDet;
			lb = document.getElementById('lblBnd'); if (lb) lb.textContent = d.lBnd;
			lb = document.getElementById('lblG20'); if (lb) lb.textContent = d.lG20;
			lb = document.getElementById('lblG40'); if (lb) lb.textContent = d.lG40;
			lb = document.getElementById('lblDrain'); if (lb) lb.textContent = d.lDrain;
			lb = document.getElementById('lblNum'); if (lb) lb.textContent = d.lNum;
			lb = document.getElementById('lblSap'); if (lb) lb.textContent = d.lSap;
			lb = document.getElementById('lblDen'); if (lb) lb.textContent = d.lDen;
			lb = document.getElementById('lblLai'); if (lb) lb.textContent = d.lLai;
			renderLegend();
		}
		function renderLegend() {
			var s = (LANG === 'zh');
			var el = document.getElementById('legend3d');
			if (!el) return;
			var html =
				'<span><i class="mon"></i>' + (s ? '监测树' : 'Monitored') + ' <b>20</b></span><br>' +
				'<span><i class="log"></i>' + (s ? '数采' : 'Loggers') + ' <b>3</b></span><br>' +
				'<span><i class="det"></i>' + (s ? '单木覆盖（按物种着色）' : 'Tree cover (by species)') + ' <b>' + DET_N + '</b></span>';
			var keys = Object.keys(SPECIES || {});
			if (DET_ON && keys.length) {
				/* 按株数排倒序，画横向条形（颜色即该树种在点云里的着色） */
				var rows = keys.map(function (k) {
					return { zh: SPECIES[k].zh, color: SPECIES[k].color, n: SPECIES[k].n || 0 };
				}).filter(function (r) { return r.n > 0; }).sort(function (a, b) { return b.n - a.n; });
				var max = rows.length ? rows[0].n : 1;
				html += '<div class="sl3d"><div class="bars">';
				rows.forEach(function (r) {
					var w = Math.max(3, Math.round(r.n / max * 100));
					html += '<div class="bar-row"><span class="bar-name">' + r.zh + '</span>' +
						'<span class="bar-track"><i class="bar" style="width:' + w + '%;background:' + r.color + '"></i></span>' +
						'<span class="bar-n">' + r.n + '</span></div>';
				});
				html += '</div></div>';
			}
			el.innerHTML = html;
		}
		applyLang();
		/* 被主页以 iframe 内嵌（?embed=1）时，去掉「返回网站」按钮（就在主页上，多余） */
		if (/[?&]embed=1/.test(location.search)) {
			var _back = document.getElementById('backBtn');
			if (_back) { _back.style.display = 'none'; }
		}
		document.getElementById('langBtn').addEventListener('click', function () {
			LANG = (LANG === 'zh') ? 'en' : 'zh';
			localStorage.setItem('bfers-3d-lang', LANG); applyLang();
		});

		// WGS-84 -> GCJ-02（供高德小地图对齐用）
		var A = 6378245.0, EE = 0.00669342162296594323;
		function outOfChina(lat, lon){ return (lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271); }
		function tLat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
			r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
			r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
			r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r;}
		function tLon(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
			r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
			r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
			r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r;}
		function gcj(lat,lon){ if(outOfChina(lat,lon)) return [lat,lon];
			var dLat=tLat(lon-105,lat-35), dLon=tLon(lon-105,lat-35);
			var rad=lat/180*Math.PI, m=Math.sin(rad); m=1-EE*m*m; var sm=Math.sqrt(m);
			dLat=(dLat*180)/((A*(1-EE))/(m*sm)*Math.PI);
			dLon=(dLon*180)/(A/sm*Math.cos(rad)*Math.PI);
			return [lat+dLat, lon+dLon]; }

		proj4.defs('EPSG:32650', '+proj=utm +zone=50 +datum=WGS84 +units=m +no_defs');
		function utmToWgs84(E,N){ var p=proj4('EPSG:32650','EPSG:4326',[E,N]); return [p[1],p[0]]; } // [lat,lon]

		var viewer = new Potree.Viewer(document.getElementById('potree_render_area'));
		viewer.setEDLEnabled(true);
		/* 轮廓增强：只轻微加一点（金总：太黑了，稍微增强一点点就够） */
		try { viewer.setEDLRadius(1.6); viewer.setEDLStrength(1.15); } catch (e) {}
		viewer.setFOV(60);
		viewer.setPointBudget(3_000_000);
		viewer.setDescription('');

		viewer.loadGUI(function () {
			viewer.setLanguage('en');
			// 隐藏 Potree 自带的 OSM 地图面板（改用左下角高德小地图）
			try { $('#menu_map').hide(); $('#menu_map').next().hide(); } catch (e) {}
			// 保持侧栏收起（只留菜单按钮），把画面让给点云
			if (viewer.sidebar && viewer.sidebar.isOpen) { viewer.toggleSidebar(); }
		});

		// 相机：只有环绕（orbit）一种模式 —— 原来的第一人称「漫游」(WASD) 已去掉。
		// 中键拖动 = 平移（控制走向）；滚轮 = 固定步长缩放（原来是按当前距离的比例，远处快、近处慢）。
		(function () {
			var oc = viewer.orbitControls;
			if (!oc) return;
			// 滚轮：覆盖掉内置的「按距离比例」步长，改成固定步长（scrollStep 在点云载入后按场景半径设定）
			oc.addEventListener('mousewheel', function (e) {
				if (this.scrollStep) { this.radiusDelta = -e.delta * this.scrollStep; }
			});
			// 中键拖动 = 平移
			oc.addEventListener('drag', function (e) {
				if (e.drag.object !== null || e.drag.mouse !== 4) { return; }   // 4 = MIDDLE（e.buttons 位掩码）
				var el = this.renderer.domElement;
				this.panDelta.x += e.drag.lastDrag.x / el.clientWidth;
				this.panDelta.y += e.drag.lastDrag.y / el.clientHeight;
				this.stopTweens();
			});
		}());

		// 右上角图层控件：复选框开关（面板常开，点选即生效）
		function bindChk(id, fn) {
			var el = document.getElementById(id);
			if (el) el.addEventListener('change', function () { fn(this.checked); });
		}
		bindChk('chkDet', function (v) { DET_ON = v; renderLegend(); });
		bindChk('chkBnd', function (v) { BND_ON = v; });
		bindChk('chkG20', function (v) { G20_ON = v; });
		bindChk('chkG40', function (v) { G40_ON = v; });
		bindChk('chkDrain', function (v) { DRAIN_ON = v; });
		bindChk('chkNum', function (v) { NUM_ON = v; });
		bindChk('chkSap', function (v) { SAP_ON = v; });
		bindChk('chkDen', function (v) { DEN_ON = v; });
		bindChk('chkLai', function (v) { LAI_ON = v; });

		var ANNOT = null, MAIN_N = 0, TREE_N = 0, SPECIES = {}, DET_ON = true, DET_N = 0,
		    BNDS = null, BND_ON = true,
		    G20_ON = false, G40_ON = false, DRAIN_ON = false, NUM_ON = false,
		    SAP_ON = false, DEN_ON = false, LAI_ON = false, MAINT = [];

		// 世界坐标(CRS) -> 屏幕像素（用相机矩阵，不需要 THREE 全局）
		function m4mul(a, b) { var o = new Array(16);
			for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++)
				o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
			return o; }
		function m4apply(m, v) { return [
			m[0]*v[0]+m[4]*v[1]+m[8]*v[2]+m[12]*v[3],
			m[1]*v[0]+m[5]*v[1]+m[9]*v[2]+m[13]*v[3],
			m[2]*v[0]+m[6]*v[1]+m[10]*v[2]+m[14]*v[3],
			m[3]*v[0]+m[7]*v[1]+m[11]*v[2]+m[15]*v[3]]; }

		var LABELS = [], tip = null;
		function addLabel(x, y, z, text, cls, info) {
			var el = document.createElement('div');
			el.className = 'lbl ' + cls; el.textContent = text;
			el.addEventListener('mousemove', function (ev) { showTip(ev, info); });
			el.addEventListener('mouseleave', hideTip);
			document.getElementById('labels').appendChild(el);
			LABELS.push({ el: el, p: [x, y, z], cls: cls });
		}
		function showTip(ev, html) { tip = tip || document.getElementById('tip');
			tip.innerHTML = html; tip.style.display = 'block';
			tip.style.left = Math.min(ev.clientX + 12, innerWidth - 250) + 'px';
			tip.style.top = (ev.clientY + 12) + 'px'; }
		function hideTip() { if (tip) tip.style.display = 'none'; }

		function project() {
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam || !LABELS.length) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			var W = innerWidth, H = innerHeight;
			var me = cam.matrixWorld.elements, cx = me[12], cy = me[13], cz = me[14];
			var TREE_DIST = 500;   // 相机离树超过这个距离就不显示单树标签（远景只留 3 个样点）
			var cand = [];
			for (var i = 0; i < LABELS.length; i++) {
				var L = LABELS[i];
				var dx = L.p[0] - cx, dy = L.p[1] - cy, dz = L.p[2] - cz;
				var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
				if (L.cls === 'tree' && dist > TREE_DIST) { L.el.classList.add('hidden'); continue; }
				var clip = m4apply(P, m4apply(V, [L.p[0], L.p[1], L.p[2], 1]));
				if (clip[3] <= 0.0001) { L.el.classList.add('hidden'); continue; }
				var sx = (clip[0] / clip[3] * 0.5 + 0.5) * W;
				var sy = (-clip[1] / clip[3] * 0.5 + 0.5) * H;
				if (sx < -80 || sx > W + 80 || sy < -30 || sy > H + 30) { L.el.classList.add('hidden'); continue; }
				cand.push({ L: L, sx: sx, sy: sy, dist: dist, prio: (L.cls === 'log' ? 0 : 1) });
			}
			// 屏幕空间去重叠：样点标签优先，树标签按距离近的优先，重叠的隐藏
			cand.sort(function (a, b) { return a.prio - b.prio || a.dist - b.dist; });
			var placed = [];
			for (var k = 0; k < cand.length; k++) {
				var c = cand[k], ok = true;
				for (var j = 0; j < placed.length; j++) {
					if (Math.abs(c.sx - placed[j].sx) < 74 && Math.abs(c.sy - placed[j].sy) < 16) { ok = false; break; }
				}
				if (!ok) { c.L.el.classList.add('hidden'); continue; }
				c.L.el.classList.remove('hidden');
				c.L.el.style.left = c.sx + 'px'; c.L.el.style.top = c.sy + 'px';
				placed.push(c);
			}
		}

		// --- 实测点画布圆点（主树/样方内树，比 DOM 标签高效） ---
		var dotCanvas = document.getElementById('dots');
		var dctx = dotCanvas.getContext('2d');
		var DOTPTS = [], DOTSCREEN = [];
		var LABEL_DIST = 260;   // 相机离点小于此距离才显示名称标签（避免远景拥挤）
		var CROWN_DIST = 200;   // 相机离树冠中心小于此距离才画填充树冠（远景画点）
		function sizeCanvas() {
			dotCanvas.width = Math.round(innerWidth * devicePixelRatio);
			dotCanvas.height = Math.round(innerHeight * devicePixelRatio);
		}
		sizeCanvas();
		window.addEventListener('resize', sizeCanvas);

		/* 设备点（径向生长仪 / 液流 / LAI）转成三维用的 UTM 坐标，塞进 DOTPTS，
		   由右上角三个复选框分别控制显隐。源：js/devices.js（WGS-84 经纬度 + 海拔）。 */
		function addDevices() {
			if (typeof DEVICES === 'undefined') return;
			var B = window.PCBOX, n_skip = 0;
			var groups = [['dendrometer', 'dev-den'], ['sapflow', 'dev-sap'], ['lai', 'dev-lai']];
			groups.forEach(function (g) {
				(DEVICES[g[0]] || []).forEach(function (d) {
					if (d.lon == null || d.lat == null) return;
					var p = proj4('EPSG:4326', 'EPSG:32650', [d.lon, d.lat]);   // -> [E, N]
					/* 点云范围外的点不画：源表里有 10 个（DEN-039~046、HB-004/005）偏了约 600 m，
					   明显是错坐标/别的场地，画出来会飘在点云外面（金总已指出）。 */
					if (B && (p[0] < B.min[0] - 2 || p[0] > B.max[0] + 2 ||
					          p[1] < B.min[1] - 2 || p[1] > B.max[1] + 2)) { n_skip++; return; }
					DOTPTS.push({ E: p[0], N: p[1], Z: (d.z || 0) + 1.5,
						name: d.name || d.id, kind: g[1] });
				});
			});
			if (n_skip) console.info('[3d] 有 ' + n_skip + ' 个设备点在点云范围外，已略过');
		}
		function drawDots() {
			dctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
			dctx.clearRect(0, 0, innerWidth, innerHeight);
			DOTSCREEN.length = 0;
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam || !DOTPTS.length) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			var W = innerWidth, H = innerHeight;
			var me = cam.matrixWorld.elements, cx = me[12], cy = me[13], cz = me[14];
			var texts = [];
			for (var i = 0; i < DOTPTS.length; i++) {
				var p = DOTPTS[i];
				var clip = m4apply(P, m4apply(V, [p.E, p.N, p.Z, 1]));
				if (clip[3] <= 0.0001) continue;
				var sx = (clip[0] / clip[3] * 0.5 + 0.5) * W;
				var sy = (-clip[1] / clip[3] * 0.5 + 0.5) * H;
				if (sx < -5 || sx > W + 5 || sy < -5 || sy > H + 5) continue;
				var dx = p.E - cx, dy = p.N - cy, dz = p.Z - cz;
				var d2 = dx * dx + dy * dy + dz * dz;

				// 标记：单木识别按物种着色；主树用 🌳；样方内树用圆点
				if (p.kind === 'det') {
					if (!DET_ON) continue;
					var col = (SPECIES[p.sp] && SPECIES[p.sp].color) || '#888888';
					if (p.ring) { drawCrown(p.ring, V, P, col); }   // Voronoi 单元：整片填色
					DOTSCREEN.push({ x: sx, y: sy, kind: 'det', sp: p.sp });
					continue;
				}
				if (p.kind === 'main') {
					var es = d2 > 400 * 400 ? 13 : (d2 > 150 * 150 ? 16 : 20);
					dctx.font = es + 'px "Segoe UI Emoji","Noto Color Emoji",serif';
					dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
					dctx.fillText('\uD83C\uDF33', sx, sy);
				} else if (p.kind && p.kind.indexOf('dev-') === 0) {
					/* 设备点：液流 / 径向生长 / LAI，各自跟复选框走 */
					if (p.kind === 'dev-sap' && !SAP_ON) continue;
					if (p.kind === 'dev-den' && !DEN_ON) continue;
					if (p.kind === 'dev-lai' && !LAI_ON) continue;
					var dc = p.kind === 'dev-sap' ? '#3fa9f5' : (p.kind === 'dev-den' ? '#f0a23c' : '#b07fd8');
					var rr = d2 > 400 * 400 ? 2.6 : (d2 > 150 * 150 ? 3.4 : 4.6);
					dctx.beginPath(); dctx.arc(sx, sy, rr, 0, 6.2832);
					dctx.fillStyle = dc; dctx.fill();
					dctx.lineWidth = 1.4; dctx.strokeStyle = 'rgba(10,13,8,.85)'; dctx.stroke();
					DOTSCREEN.push({ x: sx, y: sy, name: p.name, kind: p.kind });
					if (d2 < LABEL_DIST * LABEL_DIST) texts.push({ sx: sx, sy: sy, d2: d2, name: p.name });
					continue;
				} else {
					var r = d2 > 400 * 400 ? 1.7 : (d2 > 150 * 150 ? 2.2 : 3.2);
					dctx.globalAlpha = 0.9;
					dctx.fillStyle = '#d3a970';
					dctx.beginPath(); dctx.arc(sx, sy, r, 0, 6.2832); dctx.fill();
					dctx.lineWidth = 1; dctx.strokeStyle = 'rgba(10,13,8,.9)'; dctx.stroke();
					dctx.globalAlpha = 1;
				}
				DOTSCREEN.push({ x: sx, y: sy, name: p.name, kind: p.kind });
				if (d2 < LABEL_DIST * LABEL_DIST) texts.push({ sx: sx, sy: sy, d2: d2, name: p.name });
			}

			// 放大后显示名称（近的优先，重叠的跳过）
			if (texts.length) {
				texts.sort(function (a, b) { return a.d2 - b.d2; });
				dctx.font = '12px Raleway,"Microsoft YaHei",sans-serif';
				dctx.textAlign = 'left'; dctx.textBaseline = 'middle';
				var placed = [];
				for (var k = 0; k < texts.length; k++) {
					var t = texts[k], w = dctx.measureText(t.name).width + 8, h = 15;
					var x = t.sx + 7, y = t.sy;
					var ok = true;
					for (var j = 0; j < placed.length; j++) {
						if (Math.abs(x - placed[j].x) < (w + placed[j].w) / 2 &&
							Math.abs(y - placed[j].y) < (h + placed[j].h) / 2) { ok = false; break; }
					}
					if (!ok) continue;
					dctx.fillStyle = 'rgba(20,24,15,.78)';
					dctx.fillRect(x - 4, y - h / 2, w, h);
					dctx.fillStyle = '#e7e3d8';
					dctx.fillText(t.name, x, y);
					placed.push({ x: x, y: y, w: w, h: h });
				}
			}
		}

		// --- 样地边界 / 网格 / 水系（画在地面上，见 3d/bounds.json） ---
		function projXYZ(V, P, x, y, z) {
			var clip = m4apply(P, m4apply(V, [x, y, z, 1]));
			if (clip[3] <= 0.0001) return null;
			return [(clip[0] / clip[3] * 0.5 + 0.5) * innerWidth,
			        (-clip[1] / clip[3] * 0.5 + 0.5) * innerHeight];
		}
		function drawCrown(ring, V, P, color) {
			if (!ring || ring.length < 3) return;
			dctx.beginPath();
			for (var i = 0; i < ring.length; i++) {
				var s = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!s) return;
				if (i === 0) dctx.moveTo(s[0], s[1]); else dctx.lineTo(s[0], s[1]);
			}
			dctx.closePath();
			dctx.globalAlpha = 0.45; dctx.fillStyle = color; dctx.fill();
			dctx.globalAlpha = 0.9; dctx.strokeStyle = color; dctx.lineWidth = 1; dctx.stroke();
			dctx.globalAlpha = 1;
		}
		function drawRing(ring, V, P, fill, stroke, lw, alpha, close) {
			if (!ring || ring.length < 2) return;
			dctx.beginPath();
			for (var i = 0; i < ring.length; i++) {
				var s = projXYZ(V, P, ring[i][0], ring[i][1], ring[i][2]);
				if (!s) return;                       // 顶点跑到相机后就不画这一条
				if (i === 0) dctx.moveTo(s[0], s[1]); else dctx.lineTo(s[0], s[1]);
			}
			if (close) dctx.closePath();
			if (fill) { dctx.globalAlpha = alpha; dctx.fillStyle = fill; dctx.fill(); }
			if (stroke) { dctx.globalAlpha = 1; dctx.strokeStyle = stroke; dctx.lineWidth = lw; dctx.stroke(); }
			dctx.globalAlpha = 1;
		}
		function drawBounds() {
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam || !BNDS) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			if (BND_ON) {
				(BNDS.boundaries || []).forEach(function (b) {
					drawRing(b.pts, V, P, '#f98422', '#f98422', 2.5, 0.16, true);
				});
			}
			if (G20_ON) (BNDS.grid20 || []).forEach(function (g) { drawRing(g.pts, V, P, null, 'rgba(235,235,235,.75)', 1.1, 0, true); });
			if (G40_ON) (BNDS.grid40 || []).forEach(function (g) { drawRing(g.pts, V, P, null, 'rgba(255,210,127,.85)', 1.6, 0, true); });
			if (DRAIN_ON) (BNDS.drainage || []).forEach(function (l) { drawRing(l, V, P, null, 'rgba(60,175,255,1)', 2.2, 0, false); });
		}

		/* 格网编号：每个格子取几何中心，找最近的 RTK 实测主树（VIT16/T189…），
		 * 在中心画半透明名字。20m/40m 各自跟自己的开关走。 */
		function nearestVIT(E, N) {
			var best = '', bd = Infinity;
			for (var i = 0; i < MAINT.length; i++) {
				var dx = MAINT[i].E - E, dy = MAINT[i].N - N, d2 = dx * dx + dy * dy;
				if (d2 < bd) { bd = d2; best = MAINT[i].name; }
			}
			return best;
		}
		function drawCells() {
			if (!NUM_ON || !BNDS) return;
			var pc = viewer.scene.pointclouds[0], cam = viewer.scene.getActiveCamera();
			if (!pc || !cam) return;
			var V = cam.matrixWorldInverse.elements, P = cam.projectionMatrix.elements;
			var W = innerWidth, H = innerHeight;
			dctx.font = '11px system-ui,"Segoe UI",sans-serif';
			dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
			dctx.fillStyle = 'rgba(255,255,255,.42)';
			function one(list) {
				list.forEach(function (g) {
					var r = g.pts, n = r.length - 1, ax = 0, ay = 0, az = 0;   // 首尾重合，去掉最后一个
					for (var i = 0; i < n; i++) { ax += r[i][0]; ay += r[i][1]; az += r[i][2]; }
					ax /= n; ay /= n; az /= n;
					var clip = m4apply(P, m4apply(V, [ax, ay, az + 1.5, 1]));
					if (clip[3] <= 0) return;
					var sx = (clip[0] / clip[3] * 0.5 + 0.5) * W, sy = (-clip[1] / clip[3] * 0.5 + 0.5) * H;
					if (sx < -40 || sx > W + 40 || sy < -20 || sy > H + 20) return;
					dctx.fillText(nearestVIT(ax, ay), sx, sy);
				});
			}
			if (G20_ON) one(BNDS.grid20 || []);
			if (G40_ON) one(BNDS.grid40 || []);
		}

		// 悬停实测点显示名称
		document.getElementById('potree_render_area').addEventListener('mousemove', function (ev) {
			var best = null, bd = 144;   // 12px 内
			for (var i = 0; i < DOTSCREEN.length; i++) {
				var s = DOTSCREEN[i];
				var dd = (s.x - ev.clientX) * (s.x - ev.clientX) + (s.y - ev.clientY) * (s.y - ev.clientY);
				if (dd < bd) { bd = dd; best = s; }
			}
			if (best) {
				tip = tip || document.getElementById('tip');
				if (best.kind === 'det') {
					tip.innerHTML = '<b>' + ((SPECIES[best.sp] && SPECIES[best.sp].zh) || '') + '</b><br>' +
						(LANG === 'zh' ? '单木识别' : 'Detected tree');
				} else if (best.kind && best.kind.indexOf('dev-') === 0) {
					var dn = best.kind === 'dev-sap' ? (LANG === 'zh' ? '液流' : 'Sap flow')
					       : (best.kind === 'dev-den' ? (LANG === 'zh' ? '径向生长仪' : 'Dendrometer')
					       : 'LAI');
					tip.innerHTML = '<b>' + best.name + '</b><br>' + dn;
				} else {
					tip.innerHTML = '<b>' + best.name + '</b><br>' +
						(best.kind === 'main' ? (LANG === 'zh' ? '实测主树 (RTK)' : 'Surveyed main tree (RTK)')
						                      : (LANG === 'zh' ? '样方内树 (RTK)' : 'Quadrat tree (RTK)'));
				}
				tip.style.display = 'block';
				tip.style.left = Math.min(ev.clientX + 12, innerWidth - 250) + 'px';
				tip.style.top = (ev.clientY + 12) + 'px';
			} else { hideTip(); }
		});

		Potree.loadPointCloud('./pointclouds/index/metadata.json', 'index', function (e) {
			var pointcloud = e.pointcloud, scene = viewer.scene;
			var m = pointcloud.material;
			m.size = 1.2; m.pointSizeType = Potree.PointSizeType.FIXED;   /* 固定像素：自适应会在贴合时把点撑大，放大就糊 */
			m.shape = Potree.PointShape.CIRCLE; m.activeAttributeName = 'rgba';
			scene.addPointCloud(pointcloud);
			viewer.fitToScreen();

			var bbox = pointcloud.pcoGeometry.boundingBox;
			var off = pointcloud.pcoGeometry.offset;   // 点云范围是局部坐标，要加回 CRS 偏移
			// 滚轮缩放步长固定：取点云包围盒对角线的一个固定比例，之后不再随当前距离变化
			// （Potree 默认步长是「当前距离 × 0.1」，所以远处快、近处慢）
			if (viewer.orbitControls) {
				var _dx = bbox.max.x - bbox.min.x, _dy = bbox.max.y - bbox.min.y, _dz = bbox.max.z - bbox.min.z;
				viewer.orbitControls.scrollStep = Math.sqrt(_dx * _dx + _dy * _dy + _dz * _dz) * 0.07;
			}
			var box = { min: [bbox.min.x + off.x, bbox.min.y + off.y, bbox.min.z + off.z],
			            max: [bbox.max.x + off.x, bbox.max.y + off.y, bbox.max.z + off.z] };
			window.PCBOX = box;    /* 设备点越界过滤用 */

			fetch('annotations.json').then(function (r) { return r.json(); }).then(function (data) {
				ANNOT = data;
				/* 20 棵监测树的浮动标签（DT1-BH1-1137 那种）已按金总要求删除。
				   只留三个样地标签；第三个原来叫「气象站下方样地」，改成「油松样地」。 */
				(data.plots || []).forEach(function (p) {
					if (p.Z == null) return;
					var nm = (p.nameZh === '气象站下方样地') ? '油松样地' : p.nameZh;
					addLabel(p.E, p.N, p.Z + 30, nm, 'log',
						'<b>' + nm + '</b><br>' + (LANG === 'zh' ? '样点数采' : 'Plot logger'));
				});
				/* 103 棵 RTK 实测主树的 E/N（VIT16/T189…）—— 给「格网编号」找最近的点用 */
				MAINT = (data.maintrees || []).filter(function (m) { return m.E != null && m.N != null; })
					.map(function (m) { return { name: m.name, E: m.E, N: m.N }; });
				/* RTK 实测主树/样方内树的散点已按金总要求全部移除 */
				addDevices();
				renderLegend();
			});

			// 单木覆盖（Voronoi）：整片区域按最近的树填色
			fetch('voronoi.json').then(function (r) { return r.json(); }).then(function (vo) {
				SPECIES = vo.species || {};
				(vo.cells || []).forEach(function (c) {   // [Spe_ID, [[E,N,Z],...]]
					SPECIES[c[0]].n = (SPECIES[c[0]].n || 0) + 1;   // 该树种的单木株数
					var ring = c[1], ax = 0, ay = 0, az = 0;
					for (var i = 0; i < ring.length; i++) { ax += ring[i][0]; ay += ring[i][1]; az += ring[i][2]; }
					var n = ring.length || 1;
					DOTPTS.push({ E: ax / n, N: ay / n, Z: az / n, sp: c[0], kind: 'det', ring: ring });
				});
				DET_N = (vo.cells || []).length;
				renderLegend();
			});

			// 样地边界 / 网格 / 水系
			fetch('bounds.json').then(function (r) { return r.json(); }).then(function (b) { BNDS = b; });

			(function loop() { project(); drawDots(); drawBounds(); drawCells(); requestAnimationFrame(loop); })();
		});
	</script>
	<style>
		.lg3d b { display:inline-block; background:#c2703d; color:#fff; font-size:9px; font-weight:700;
			padding:0 3px; border-radius:3px; box-shadow:0 1px 3px rgba(0,0,0,.6); }
	</style>
</body>
</html>
